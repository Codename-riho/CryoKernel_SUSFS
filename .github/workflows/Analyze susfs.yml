name: "Analisis SUSFS (pinned vs latest)"

on:
  workflow_dispatch:
    inputs:
      old_commit:
        description: "Commit SUSFS pembanding (yang dulu berhasil)"
        default: "2ad297356931ba06b4edc0860f42fdd143b02ffd"
      new_commit:
        description: "Commit SUSFS target (kosongkan = latest)"
        default: ""

jobs:
  analyze:
    name: "Analisis ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
          - name: "CLO"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r16-rel"
    steps:
      - name: "Clone kernel (bersih, tanpa patch lain)"
        run: |
          git clone -q --depth=1 --branch "${{ matrix.kernel.branch }}" "${{ matrix.kernel.repo_url }}" kernel
          git -C kernel log -1 --oneline

      - name: "Analisis patch SUSFS"
        working-directory: kernel
        env:
          OLD: ${{ inputs.old_commit }}
          NEW_IN: ${{ inputs.new_commit }}
          SUSFS_URL: https://gitlab.com/simonpunk/susfs4ksu.git
          SUSFS_BRANCH: gki-android13-5.15
          REPORT_NAME: ${{ matrix.kernel.name }}
        run: |
          set +e
          REPORT="$GITHUB_WORKSPACE/laporan-$REPORT_NAME.txt"
          exec > >(tee "$REPORT") 2>&1

          P=kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          SYMS="VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT DEFAULT_KSU_MNT_ID DEFAULT_KSU_MNT_GROUP_ID CL_COPY_MNT_NS susfs_is_sdcard_android_data_not_decrypted"

          rm -rf /tmp/susfs
          git clone -q -b "$SUSFS_BRANCH" "$SUSFS_URL" /tmp/susfs || { echo "::error::clone SUSFS gagal"; exit 1; }
          NEW="${NEW_IN:-$(git -C /tmp/susfs rev-parse HEAD)}"
          git -C /tmp/susfs cat-file -e "$OLD^{commit}" 2>/dev/null || { echo "::error::commit lama tidak ditemukan: $OLD"; exit 1; }
          git -C /tmp/susfs cat-file -e "$NEW^{commit}" 2>/dev/null || { echo "::error::commit baru tidak ditemukan: $NEW"; exit 1; }
          echo "kernel : $REPORT_NAME ($(git log -1 --oneline))"
          echo "lama   : $OLD"
          echo "baru   : $NEW"

          echo; echo "######## COMMIT SETELAH LAMA (maks 30)"
          git -C /tmp/susfs log --oneline "$OLD..$NEW" | head -30
          echo; echo "######## FILE KERNEL_PATCHES YANG BERUBAH"
          git -C /tmp/susfs diff --stat "$OLD" "$NEW" -- kernel_patches | tail -40
          git -C /tmp/susfs diff -U3 "$OLD" "$NEW" -- kernel_patches > "$GITHUB_WORKSPACE/diff-susfs-$REPORT_NAME.txt"
          echo; echo "######## DIFF PATCH KERNEL (150 baris pertama; lengkapnya di artifact)"
          git -C /tmp/susfs diff -U2 "$OLD" "$NEW" -- "$P" | head -150

          reset_tree() { git reset -q --hard; git clean -fdq; }

          analyze() {  # $1=commit $2=plain|fake
            reset_tree
            git -C /tmp/susfs checkout -q "$1"
            echo; echo "######## APPLY NYATA @ ${1:0:7} ($2)"
            if [ "$2" = "fake" ]; then
              sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
              sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            fi
            mkdir -p fs include/linux
            cp -f /tmp/susfs/kernel_patches/fs/* fs/ 2>/dev/null
            cp -f /tmp/susfs/kernel_patches/include/linux/* include/linux/ 2>/dev/null
            OUT=$(patch -p1 --forward --no-backup-if-mismatch < "/tmp/susfs/$P" 2>&1)
            RC=$?
            echo "$OUT" | grep -E "FAILED|can't find|Reversed|rejects|fuzz" || echo "  semua hunk OK (tanpa fuzz)"
            echo "  exit patch: $RC"
            for r in $(find . -name '*.rej' -not -path './.git/*'); do
              echo "  ----- REJECT: $r"
              head -80 "$r" | sed 's/^/    /'
            done
            echo "  -- namespace.c menyertakan header susfs?"
            grep -n "susfs" fs/namespace.c | head -4 | sed 's/^/    /'
            [ -n "$(grep -n susfs fs/namespace.c)" ] || echo "    (tidak ada referensi susfs)"
            echo "  -- definisi simbol yang tadi error"
            for s in $SYMS; do
              D=$(grep -rnwE "$s" include fs 2>/dev/null | grep -E "#define|extern|DEFINE_STATIC_KEY|enum" | head -1)
              if [ -n "$D" ]; then echo "    OK   $s  <- $D" | cut -c1-150; else echo "    HILANG $s"; fi
            done
            reset_tree
          }

          for C in "$OLD" "$NEW"; do
            analyze "$C" plain
            analyze "$C" fake
          done
          echo; echo "SELESAI"

      - name: "Upload laporan"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laporan-susfs-${{ matrix.kernel.name }}
          path: |
            laporan-*.txt
            diff-susfs-*.txt
          retention-days: 3
