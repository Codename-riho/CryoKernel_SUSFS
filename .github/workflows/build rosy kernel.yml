name: Redmi 5 ARM64 Kernel 4.9 + KernelSU-Next (AnyKernel3)

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build:
    runs-on: ubuntu-26.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      KERNEL_LOC_DIR: "."

    steps:
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex git \
          libssl-dev libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang lld llvm \
          device-tree-compiler \
          unzip zip cpio

    - name: 🧹 Aggressive Cleanup
      run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

    - name: "🌟 Clone kernel source"
      working-directory: ./${{ env.KERNEL_LOC_DIR }}
      run: |
        # Atur buffer git untuk mencegah early EOF
        git config --global http.postBuffer 524288000

        # Retry loop untuk clone kernel Xiaomi Rosy
        for i in {1..3}; do
          git clone --recursive --branch lineage-21.0 \
            https://github.com/baunilla/android_kernel_xiaomi_rosy.git ${{ env.KERNEL_NAME }} --depth=1 && break || {
            echo "⚠️ Clone gagal, mencoba ulang ($i/3)..."
            sleep 5
          }
        done
        
    - name: Fetch Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang
        echo "$HOME/proton-clang/bin" >> $GITHUB_PATH

    - name: Cleanup old KernelSU artifacts
      run: |
        sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig || true
        sed -i '/kernelsu\//d' drivers/Makefile || true
        rm -rf drivers/kernelsu

    - name: Emded BakaSU
      run: |
        git clone --depth=1 -b main https://github.com/Baka-SU/BakaSU.git
        cp -r ksu-next/kernel drivers/kernelsu

        grep -q 'kernelsu/' drivers/Makefile || \
          echo 'obj-$(CONFIG_KERNELSU) += kernelsu/' >> drivers/Makefile

        grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
          sed -i '/menu "Device Drivers"/a source "drivers/kernelsu/Kconfig"' drivers/Kconfig

    - name: Configure kernel
      run: |
        make O=$OUT_DIR msm8937-perf_defconfig

    - name: Enable KernelSU & required options
      run: |
        scripts/config --file $OUT_DIR/.config \
          --enable CONFIG_KERNELSU \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_MODULES \
          --enable CONFIG_SYSFS \
          --enable CONFIG_SECURITY_SELINUX

        make O=$OUT_DIR olddefconfig

    - name: Disable Spectre BHB
      run: |
        scripts/config --file $OUT_DIR/.config \
          --disable CONFIG_ARM64_SPECTRE_BHB
        make O=$OUT_DIR olddefconfig
       
        cat << 'EOF' > arch/arm64/kernel/spectre_bhb_stub.c
        // SPDX-License-Identifier: GPL-2.0
        #include <linux/kernel.h>

        void spectre_bhb_enable_mitigation(void) {}
        void spectre_bhb_patch_loop_iter(void) {}

        EXPORT_SYMBOL(spectre_bhb_enable_mitigation);
        EXPORT_SYMBOL(spectre_bhb_patch_loop_iter);
        EOF

        grep -q spectre_bhb_stub arch/arm64/kernel/Makefile || \
          echo 'obj-y += spectre_bhb_stub.o' >> arch/arm64/kernel/Makefile

    # https://raw.githubusercontent.com/baunilla/android_kernel_xiaomi_rosy/refs/heads/lineage-21.0/init/Kconfig
    # the flag was set as y which shouldn't be allowed
    - name: Fix kallsyms
      run: |        
        sed -i \
          's/default !IA64 && !(TILE && 64BIT)/default n/' \
          init/Kconfig
        # Sanity check
        grep -n "config KALLSYMS_BASE_RELATIVE" -A5 init/Kconfig

        
    - name: Build kernel 
      run: |
        make -j$(nproc) O=$OUT_DIR \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        rm -rf AnyKernel3/.git

    - name: Prepare AnyKernel3
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

        sed -i 's/do.devicecheck=1/do.devicecheck=0/' AnyKernel3/anykernel.sh
        sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot;/' AnyKernel3/anykernel.sh

    - name: Package AnyKernel3 zip
      run: |
        cd AnyKernel3
        zip -r ../rosy-kernel-ksu.zip *
        cd ..

    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: rosy-kernel-ksu-anykernel3
        path: rosy-kernel-ksu.zip
