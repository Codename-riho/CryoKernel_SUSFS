          • Images: <code>${IMAGES}</code>
          • KSU Manager: <code>${KSU_MANAGER}</code>
          • SUSFS: <code>${SUSFS_TEXT}</code>
          • Droidspaces: <code>${DS}</code>${GL}
          • Local Version: <code>Cryo-GKI-${DATE}</code>, <code>Cryo-CLO-${DATE}</code>

          🕐 <b>Build Date:</b> $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')
          🔗 <a href=\"${RUN_URL}\">Unduh dari Artifacts</a>"
          
          tg_send() {
            local text="$1" len resp
            len=$(printf '%s' "$text" | sed -e 's/<[^>]*>//g' | wc -m)
            if [ -n "${TELEGRAM_IMAGE_URL:-}" ] && [ "$len" -le 1000 ]; then
              resp=$(curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                --data-urlencode "chat_id=${TELEGRAM_USER_ID}" \
                --data-urlencode "photo=${TELEGRAM_IMAGE_URL}" \
                --data-urlencode "caption=${text}" \
                --data-urlencode "parse_mode=HTML")
              if echo "$resp" | jq -e '.ok' >/dev/null 2>&1; then return 0; fi
            fi
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_USER_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode 'link_preview_options={"is_disabled":true}' \
              --data-urlencode "text=${text}" >/dev/null
          }
          tg_send "$MSG"

  notify-failure:
    name: "📱 Notify Telegram (failed)"
    runs-on: ubuntu-latest
    needs: [build-kernels, package-kernels]
    if: failure()
    permissions:
      actions: read
    steps:
      - name: "📱 Send to Telegram"
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          SUSFS_SUPPORT: ${{ inputs.susfsSupport || 'Enabled' }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          TOOLCHAIN_TYPE: ${{ inputs.toolchain_type || 'android-tools' }}
          CUSTOM_CLANG_REPO: ${{ inputs.customClangRepo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && exit 0
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          FAILED=""
          while IFS=$'\t' read -r job step; do
            [ -n "$job" ] && FAILED+="• <b>$(printf '%s' "$job" | esc)</b> → <code>$(printf '%s' "$step" | esc)</code>"$'\n'
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion=="failure") | [.name, (([.steps[]? | select(.conclusion=="failure")][0].name) // "-")] | @tsv' 2>/dev/null || true)
          [ -z "$FAILED" ] && FAILED="• (detail tidak tersedia)"$'\n'
          [ "$TOOLCHAIN_TYPE" = "custom-tools" ] && BT="custom-tools (${CUSTOM_CLANG_REPO:-unknown})" || BT="android-tools"
          
          MSG="❌ <b>Kernel Build Failed</b>

          <b>👾 Configuration:</b>
          • KSU Manager: <code>${KSU_MANAGER}</code>
          • Build Tools: <code>${BT}</code>

          💥 <b>Gagal di:</b>
          ${FAILED}
          🔍 Cek <a href=\"${RUN_URL}\">workflow logs</a>"
          
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_USER_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" >/dev/null
