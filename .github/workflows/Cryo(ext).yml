          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_SUPPORT: ${{ inputs.susfsSupport || 'Enabled' }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          DROIDSPACES_SUPPORT: ${{ inputs.droidspaces_support || 'Enabled' }}
          GAMING_MODE: ${{ inputs.gaming_mode || '' }}
          TOOLCHAIN_TYPE: ${{ inputs.toolchain_type || 'android-tools' }}
          DEVICE_NAME: "Redmi Note 12 4G"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && exit 0
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          [ "$SUSFS_SUPPORT" = "Disabled" ] && SUSFS_TEXT="Disabled" || SUSFS_TEXT="Enabled (GKI A13-5.15, ${SUSFS_COMMIT:-latest})"
          [ "$GAMING_MODE" = "Enabled" ] && GL=$'\n'"• Gaming Mode: <code>Enabled (Vorpal + Fair Scheduler)</code>" || GL=$'\n'"• Gaming Mode: <code>Disabled</code>"
