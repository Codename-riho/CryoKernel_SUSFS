name: "Build Cryo Kernel"
env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: write
  actions: read
on:
  workflow_dispatch:
     inputs:
      ksu_manager:
        description: "Root manager varian KSU"
        type: choice
        options: [BakaSU, BakaSU-susfs, SukiSU-Ultra+KPM, KernelSU-Next-pershoot, KernelSU-Next, KernelSU-Official, Rissu-KSU]
        default: "BakaSU-susfs"
      ksu_ref:
        description: "Opsional: branch/tag manager (kosong = bawaan)"
        required: false
        default: ""
      toolchain_type:
        description: "Jenis Toolchain"
        type: choice
        options: [android-tools, custom-tools]
        default: android-tools       
      customClangRepo:
        description: "Repo clang (JIKA 'custom-tools')"
        type: choice 
        options: [greenforce-project/greenforce_clang, Neutron-Toolchains/antman]
        default: greenforce-project/greenforce_clang
      droidspaces_support: 
       description: "Droidspaces proper support?"
       type: choice
       options: [Enabled, Disabled]
       default: Enabled
      susfsSupport:
        description: "SUSFS Implementation?"
        type: choice
        options: [Enabled, Disabled]
        default: Enabled
      susfs_force_hunk:
       description: "Paksa hunk yang gagal"
       type: choice
       options: [Enabled, Disabled]
       default: Enabled
      susfs_strict:
        description: "Hentikan build kalau integrasi SUSFS tidak sempurna"
        type: boolean
        default: false
      susfs_commit:
        description: "Commit hash SUSFS4KSU (kosongkan untuk latest)"
        type: string
        default: ""
      gaming_mode:
        description: "Gaming mode: Enabled = Vorpal + bias scheduler; Disabled = standar"
        type: choice
        options: [Disabled, Enabled]
        default: Disabled

jobs:
  build-kernels:
    name: "❄️ Build Cryo ${{ matrix.kernel.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches: ["https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"]
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r16-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches: ["https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"]
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches: ["https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"]
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r16-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches: ["https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch", "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"]
    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "🧹 Setup, Cleanup & Swap"
        run: |
          echo "Memulai pembersihan direktori yang tidak diperlukan..."
          # Menghapus alat prapasang yang berat dan jarang dipakai untuk membebaskan ruang disk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          echo "Membersihkan cache Docker..."
          # Membersihkan sisa-sisa image dan cache dari Docker
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

          echo "Membuat dan mengaktifkan file SWAP sebesar 24GB..."
          # Membuat file kosong sebesar 24 Gigabyte (kamu bisa mengubah '24G' sesuai kebutuhan)
          sudo fallocate -l 24G /swapfile
          # Mengatur izin akses file agar hanya sistem root yang bisa membaca/menulisnya demi keamanan
          sudo chmod 600 /swapfile
          # Mengubah format file kosong tersebut menjadi area Swap
          sudo mkswap /swapfile
          # Menyalakan Swap agar RAM sistem virtual bertambah
          sudo swapon /swapfile
          
          echo "Pembersihan dan pengaturan SWAP selesai!"
          
      - name: "🔧 System Prep & Dependencies"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af && sudo docker builder prune -af
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf >/dev/null && sudo sysctl -p
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq && sudo apt-get install -yq repo rsync aria2 bc bison build-essential ca-certificates clang cpio curl dwarves flex gcc-aarch64-linux-gnu git libdw-dev libelf-dev libssl-dev lld llvm llvm-dev pkg-config python3 unzip xz-utils zip
          mkdir -p ${{ env.KERNEL_LOC_DIR }}

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git config --global http.postBuffer 524288000
          for i in {1..3}; do git clone --recursive -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1 && break || sleep 5; done
            
      - name: "📥 Init AOSP & Android Toolchains"
        if: github.event.inputs.toolchain_type == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          git config --global http.postBuffer 524288000 && git config --global http.lowSpeedLimit 1000 && git config --global http.lowSpeedTime 600
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1 && repo sync -c --optimized-fetch --prune -j2
          rm -rf .repo common
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r614150.tar.gz "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
          tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
          rm -rf prebuilts/clang/host/linux-x86/clang-r614250.tar.gz prebuilts/clang/host/linux-x86/clang-r547379.tar.gz prebuilts/clang/host/linux-x86/clang-3289846 prebuilts/clang/host/linux-x86/clang-r450784e prebuilts/clang/host/linux-x86/clang-r596125 prebuilts/clang/host/linux-x86/clang-stable
          sed -i -e 's/^BRANCH=.*/BRANCH=android13-5.15/' -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "💫 Get Custom Toolchains"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_REPO: ${{ github.event.inputs.customClangRepo }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$CLANG_REPO/releases/latest")
          clang_url=$(echo "$RELEASE_JSON" | grep -Eo 'https://[^\"]+\.(tar\.gz|tar\.xz|tar\.bz2|zip|tgz)' | head -n1 || true)
          [ -n "$clang_url" ] || { echo "::error::Asset tidak ditemukan"; exit 1; }
          mkdir -p clang_toolchain && wget -q -O arch_tool "$clang_url"
          tar -xf arch_tool -C clang_toolchain || unzip -q arch_tool -d clang_toolchain; rm -f arch_tool
          CLANG_EXEC=$(find clang_toolchain -name "clang" -path "*/bin/clang" -print -quit || find clang_toolchain -name "clang" -print -quit)
          [ -n "$CLANG_EXEC" ] || { echo "::error::Biner clang hilang"; exit 1; }
          CLANG_PATH="$(readlink -f "$(dirname "$CLANG_EXEC")")"
          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV" && echo "$CLANG_PATH" >> "$GITHUB_PATH"
          "$CLANG_PATH/clang" --version | head -n1

      - name: "😎 Set args & Custom Makefile (GKI)"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
            [ -n "${{ env.OUT_DIR }}" ] && mkdir -p $(pwd)/${{ env.OUT_DIR }}
            for f in "-Wno-default-const-init-unsafe" "-Wno-uninitialized-const-pointer" "-Wno-implicit-function-declaration" "-Wno-sometimes-uninitialized"; do
              echo "KBUILD_CFLAGS += $f" >> Makefile
            done

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' "$CONFIG_FILE" || true
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}\"" >> "$CONFIG_FILE"
          
          apply_patch() {
            local file=$(basename "$1")
            curl -sL -o "$file" "$1"
            if patch -p1 -R --dry-run -s -f < "$file" >/dev/null 2>&1; then echo "✅ Dilewati: $file"; else patch -p1 --batch < "$file" || exit 1; fi
            rm -f "$file"
          }
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do [ -n "$p" ] && apply_patch "$p"; done
          
          scripts/config --file "$CONFIG_FILE" -e CONFIG_KALLSYMS -e CONFIG_TCP_CONG_ADVANCED -d CONFIG_TCP_CONG_BIC -d CONFIG_TCP_CONG_HTCP -e CONFIG_TCP_CONG_WESTWOOD -e CONFIG_TCP_CONG_BBR -e CONFIG_TCP_CONG_BBR3 -d CONFIG_DEFAULT_BBR -e CONFIG_DEFAULT_BBR3 --set-str CONFIG_DEFAULT_TCP_CONG "bbr3" -e CONFIG_OVERLAY_FS -e CONFIG_TMPFS_XATTR -e CONFIG_TMPFS_POSIX_ACL -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT -e CONFIG_PM_WAKELOCKS --set-val CONFIG_PM_WAKELOCKS_LIMIT 100 -e CONFIG_PM_WAKELOCKS_GC -e CONFIG_SUSPEND -e CONFIG_SUSPEND_FREEZER -e CONFIG_LRU_GEN -e CONFIG_LRU_GEN_ENABLED -e CONFIG_CRYPTO_LZ4 -e CONFIG_KERNEL_LZ4 -e ZRAM_DEF_COMP_LZ4 --set-str CONFIG_ZRAM_DEF_COMP "lz4" -d CONFIG_KERNEL_GZIP -d CONFIG_KERNEL_LZO -d CONFIG_KERNEL_XZ -d CONFIG_KERNEL_ZSTD -d CONFIG_KERNEL_BZIP2 -d CONFIG_KERNEL_UNCOMPRESSED -d CONFIG_KPROFILES
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE" || true

      - name: "🚄 Apply BBRv3 + PLB"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          BBR3_SHA: 7bc9793d909f52f4a6cd45dd1381b2f200c18a7c
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/bbr3.patch "https://github.com/topnotchfreaks/kernel_msm-5.15/commit/${BBR3_SHA}.patch"
          git apply -v --exclude=arch/arm64/configs/unified_defconfig /tmp/bbr3.patch || { echo "::error::BBRv3 patch gagal"; exit 1; }
        
      - name: "🏷️ Force short localversion"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          VER="${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}"
          echo -e "#!/bin/sh\nprintf '%s' \"$VER\"" > scripts/setlocalversion && chmod +x scripts/setlocalversion
          rm -f .scmversion localversion*
                    
      - name: "🔲 Add Droidspaces Support"
        if: github.event.inputs.droidspaces_support == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          DS_REF: main
          DS_OPTIONAL_FEATURES: "true"
        run: |
          set -euo pipefail
          DS_RAW="${DS_RAW:-https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/${DS_REF}/Documentation/resources/kernel-patches/GKI}"
          KVER=$(sed -n 's/^VERSION = //p' Makefile | head -n 1) && KPL=$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n 1)
          KNUM=$((KVER * 100 + KPL))
          PATCHES="below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          [ "$KNUM" -le 510 ] && PATCHES="$PATCHES below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          for p in $PATCHES; do
            f="/tmp/ds_$(basename "$p")"
            curl -fsSL --retry 3 -o "$f" "$DS_RAW/$p"
            git apply --check -R --ignore-whitespace "$f" >/dev/null 2>&1 || git apply -v --ignore-whitespace "$f"
            rm -f "$f"
          done
          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          REQUIRED="SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE"
          OPTIONAL="USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET TMPFS_POSIX_ACL TMPFS_XATTR"
          [ "${DS_OPTIONAL_FEATURES:-true}" = "true" ] || OPTIONAL=""
          for o in $REQUIRED $OPTIONAL; do scripts/config --file "$CFG" -e "CONFIG_$o"; done
          for o in CFS_BANDWIDTH CGROUP_PIDS; do grep -q "^CONFIG_${o}=y" "$CFG" && echo "::warning::CONFIG_${o}=y berisiko merusak kABI"; done || true

      - name: '⚙️ Inject Reflex & Vorpal Governors'
        if: github.event.inputs.gaming_mode == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          REF_REPO: kusonekoworld-max/KonekoKernel-GKI
          VOR_REPO: yougotme101/KonekoKernel-GKI
        run: |
          set -euo pipefail
          mkdir -p kernel/sched
          curl -fsSL -o kernel/sched/cpufreq_reflex.c "https://raw.githubusercontent.com/${REF_REPO}/main/.github/actions/build-kernel/patches/reflex/cpufreq_reflex.c"
          curl -fsSL -o kernel/sched/cpufreq_vorpal.c "https://raw.githubusercontent.com/${VOR_REPO}/main/.github/actions/build-kernel/patches/vorpal/cpufreq_vorpal.c"
          curl -fsSL -o kernel/sched/rfx_gki510_compat.c "https://raw.githubusercontent.com/${VOR_REPO}/main/.github/actions/build-kernel/patches/vorpal/rfx_gki510_compat.c"
          
          grep -q "cpufreq_reflex.o" "kernel/sched/Makefile" || echo 'obj-$(CONFIG_CPU_FREQ_GOV_REFLEX) += cpufreq_reflex.o' >> "kernel/sched/Makefile"
          grep -q "cpufreq_vorpal.o" "kernel/sched/Makefile" || echo 'obj-$(CONFIG_CPU_FREQ_GOV_VORPAL) += cpufreq_vorpal.o' >> "kernel/sched/Makefile"
          grep -q "rfx_gki510_compat.o" "kernel/sched/Makefile" || echo 'obj-y += rfx_gki510_compat.o' >> "kernel/sched/Makefile"
          
          CFG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_CPU_FREQ_GOV_REFLEX=y" >> "$CFG" && echo "CONFIG_CPU_FREQ_GOV_VORPAL=y" >> "$CFG"

          VORPAL_C="kernel/sched/cpufreq_vorpal.c"
          perl -0pi -e 's{(static int __init vorpal_gov_init\(void\)\n\{\n\tint ret;\n)}{$1\tbool input_ok;\n}' "$VORPAL_C"
          perl -0pi -e 's{\tif \(input_register_handler\(&rfx_input_handler\)\)\n\t\tpr_warn\("vorpal: input handler register failed \(touch boost off\)\\n"\);}{\tinput_ok = !input_register_handler(&rfx_input_handler);\n\tif (!input_ok)\n\t\tpr_warn("vorpal: input handler register failed (touch boost off)\\n");}' "$VORPAL_C"
          perl -0pi -e 's{\tret = cpufreq_register_governor\(&vorpal_gov\);\n\tif \(ret\) \{\n\t\tinput_unregister_handler\(&rfx_input_handler\);\n\t\tcancel_delayed_work_sync\(&rfx_thermal_work\);\n\t\}}{\tret = cpufreq_register_governor(&vorpal_gov);\n\tif (ret) \{\n\t\tif (input_ok)\n\t\t\tinput_unregister_handler(&rfx_input_handler);\n\t\tcancel_delayed_work_sync(&rfx_thermal_work);\n\t\}}' "$VORPAL_C"

      - name: 'Inject Vorpal Bias into fair.c'
        if: github.event.inputs.gaming_mode == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          FAIR_C="kernel/sched/fair.c"
          cp "$FAIR_C" "$FAIR_C.orig"
          perl -0pi -e 's{(static unsigned int normalized_sysctl_sched_latency\s*=\s*6000000ULL;)}{$1\n\nextern int sched_gaming_active;\n\n#define GAMING_VRUNTIME_STRETCH\t\t4\n}' "$FAIR_C"
          perl -0pi -e 's{(\tcurr->vruntime \+= calc_delta_fair\(delta_exec, curr\);\n)(\tupdate_min_vruntime\(cfs_rq\);\n)}{$1\n\tif (unlikely(sched_gaming_active \&\& !entity_is_task(curr))) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec * (GAMING_VRUNTIME_STRETCH - 1), curr);\n\t} else if (unlikely(sched_gaming_active \&\& entity_is_task(curr) \&\&\n\t\t\t     curr->avg.load_avg < 100)) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec, curr);\n\t}\n$2}' "$FAIR_C"
          perl -0pi -e 's{(\tdelta_exec = curr->sum_exec_runtime - curr->prev_sum_exec_runtime;\n)(\ttrace_android_rvh_check_preempt_tick)}{$1\n\tif (unlikely(sched_gaming_active) \&\& entity_is_task(curr)) {\n\t\tstruct task_struct *p = task_of(curr);\n\n\t\tif (p->static_prio > DEFAULT_PRIO \&\&\n\t\t    delta_exec > ideal_runtime / 2)\n\t\t\tresched_curr(rq_of(cfs_rq));\n\t}\n\n$2}' "$FAIR_C"
          perl -0pi -e 's{(\tfor_each_sched_entity\(se\) \{\n\t\tcfs_rq = cfs_rq_of\(se\);\n\n)(\t\tupdate_load_avg\(cfs_rq, se, UPDATE_TG\);\n\t\tse_update_runnable\(se\);\n\t\tupdate_cfs_group\(se\);)}{$1\t\tif (unlikely(sched_gaming_active \&\& entity_is_task(se) \&\&\n\t\t\t     task_of(se)->static_prio <= DEFAULT_PRIO))\n\t\t\tse->vruntime -= min_t(u64, se->vruntime, NSEC_PER_MSEC);\n\n$2}' "$FAIR_C"
          perl -0pi -e 's{(\tdelta = rq_clock_task\(env->src_rq\) - p->se\.exec_start;\n\n)(\treturn delta < \(s64\)sysctl_sched_migration_cost;\n\}\n)}{$1\t/* Gaming task isolation */\n\tif (sched_gaming_active) {\n\t\tif (capacity_orig_of(env->dst_cpu) < capacity_orig_of(env->src_cpu) \&\&\n\t\t    task_util(p) > (capacity_orig_of(env->src_cpu) >> 3))\n\t\t\treturn 1;\n\t\treturn delta < (s64)sysctl_sched_migration_cost * 2;\n\t}\n\n$2}' "$FAIR_C"
          MISSING=""
          for M in "extern int sched_gaming_active;" "GAMING_VRUNTIME_STRETCH" "ideal_runtime / 2" "NSEC_PER_MSEC" "Gaming task isolation"; do grep -qF "$M" "$FAIR_C" || MISSING="$MISSING [$M]"; done
          [ -n "$MISSING" ] && mv -f "$FAIR_C.orig" "$FAIR_C" || rm -f "$FAIR_C.orig"
          
      - name: "😋 Add BBG & NoMount"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          scripts/config --file arch/arm64/configs/${{ env.DEFCONFIG_NAME }} -e CONFIG_BBG
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -
          
      - name: "⚔️ Setup root manager"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          KSU_REF: ${{ inputs.ksu_ref }}
          ENABLE_SUSFS: ${{ inputs.susfsSupport || 'Enabled' }}
        run: |
          set -euo pipefail
          MULTI="https://raw.githubusercontent.com/RapliVx/kernel_builder/refs/heads/main/patch/ksun-add-more-managers-support.patch"
          EXTRA_PATCH=""
          case "$KSU_MANAGER" in
            BakaSU)                 REPO="Baka-SU/BakaSU";              B=main;         REF=main;       SUS=0 ;;
            BakaSU-susfs)           REPO="Baka-SU/BakaSU";              B=main;         REF=sync-susfs; SUS=0 ;;
            SukiSU-Ultra+KPM)       REPO="SukiSU-Ultra/SukiSU-Ultra";   B=main;         REF=builtin;    SUS=0 ;;
            KernelSU-Next)          REPO="KernelSU-Next/KernelSU-Next"; B=dev;          REF="";         SUS=1 ;;
            KernelSU-Next-pershoot) REPO="pershoot/KernelSU-Next";      B=dev-susfs;    REF=dev-susfs;  SUS=0;    EXTRA_PATCH="$MULTI" ;;
            KernelSU-Official)      REPO="tiann/KernelSU";              B=main;         REF="";         SUS=1;    EXTRA_PATCH="$MULTI" ;;
            Rissu-KSU)              REPO="rsuntk/KernelSU";             B=main;         REF="";         SUS=1 ;;
            *) exit 1 ;;
          esac
          [ "$ENABLE_SUSFS" = "Disabled" ] && SUS=0
          REF="${KSU_REF:-$REF}"
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -fsSL -o /tmp/k.sh "https://raw.githubusercontent.com/${REPO}/${B}/kernel/setup.sh"
          bash -x /tmp/k.sh ${REF:+"$REF"}
          KSU_DIR=$(readlink -f drivers/kernelsu)
          { echo "KSU_DIR=$KSU_DIR"; echo "NEED_SUSFS_PATCH=$SUS"; echo "EXTRA_PATCH_URL=$EXTRA_PATCH"; echo "KSU_REF_USED=${REF:-latest}"; } >> "$GITHUB_ENV"

      - name: "🩹 Patch manager with SUSFS & Extra"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }} 
        run: |
          set -euo pipefail
          if [ "${{ inputs.susfsSupport }}" = "Enabled" ] && [ "$NEED_SUSFS_PATCH" = "1" ]; then
            rm -rf /tmp/susfs4ksu && git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
            PATCH_FILE=/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
            if patch -d "$KSU_DIR" -p1 --forward --dry-run < "$PATCH_FILE" >/dev/null 2>&1; then
              patch -d "$KSU_DIR" -p1 --forward --batch < "$PATCH_FILE"
            else
              echo "::error::Uji coba patch gagal! Kode bentrok." && exit 1
            fi
          fi
          if [ -n "$EXTRA_PATCH_URL" ]; then
            curl -fsSL -o /tmp/ext.patch "$EXTRA_PATCH_URL"
            patch -d "$KSU_DIR" -p1 --forward --batch < /tmp/ext.patch
          fi
          scripts/config --file "arch/arm64/configs/$DEFCONFIG_NAME" -e CONFIG_KSU
          [ "$KSU_MANAGER" = "SukiSU-Ultra+KPM" ] && scripts/config --file "arch/arm64/configs/$DEFCONFIG_NAME" -e CONFIG_KPM
          
      - name: "ඞ Inject SUSFS Integration"
        if: matrix.kernel.enable_ksu == true && github.event.inputs.susfsSupport == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          FORCE_HUNK: ${{ inputs.susfs_force_hunk || 'Enabled' }}
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP:-/tmp}/susfs_logs"; mkdir -p "$LOG_DIR"
          rm -rf susfs4ksu
          if [ -n "${SUSFS_COMMIT:-}" ]; then git clone -q -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu && git -C susfs4ksu checkout -q "$SUSFS_COMMIT"; else git clone -q --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu; fi
          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          
          # Fake patches
          NS=0; MM=0
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c; NS=1; fi
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c; MM=1; fi
          
          patch -p1 --forward -F0 -l --no-backup-if-mismatch < "$PATCH_FILE" || true
          
          # Revert fake patches
          [ "$NS" = "1" ] && sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c || true
          [ "$MM" = "1" ] && sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c || true

          cat > "$LOG_DIR/fh.py" << 'PY'
          import os, re, shutil, sys

          T = float(os.environ.get("FORCE_THRESHOLD", "0.5"))
          B = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "susfs_backup")

          def norm(s):
              return " ".join(s.split())

          def p_rej(p):
              h, c = [], None
              with open(p, encoding="utf-8", errors="surrogateescape") as fh:
                  for r in fh.read().split("\n"):
                      m = re.match(r"^@@ -(\d+)(?:,\d+)? \+\d+(?:,\d+)? @@", r)
                      if m:
                          c = {"s": int(m.group(1)), "l": []}
                          h.append(c)
                      elif c and r[:1] in " +-":
                          c["l"].append((r[0], r[1:]))
              return h

          def loc(tn, on, hint):
              idx = [k for k, s in enumerate(on) if s]
              if not idx or len(tn) < len(on):
                  return None, 0.0
              nd = min(2, len(idx))
              bi, bs = None, 0.0
              for i in range(len(tn) - len(on) + 1):
                  hits = sum(1 for k in idx if tn[i+k] == on[k])
                  if hits < nd:
                      continue
                  s = hits / len(idx) - abs(i - hint) / (len(tn) * 100.0)
                  if s > bs:
                      bi, bs = i, s
              return bi, bs

          def app(tgt, hunk):
              ln = hunk["l"]
              old = [l for t, l in ln if t in " -"]
              tn = [norm(x) for x in tgt]
              dst = [norm(a) for t, a in ln if t == "+" and len(norm(a)) > 12]
              if dst and all(a in set(tn) for a in dst):
                  return "already", 0.0
              if not old:
                  return "fail", 0.0
              i, score = loc(tn, [norm(x) for x in old], hunk["s"] - 1)
              if i is None or score < T * 0.9:
                  return "fail", score
              out, k = [], 0
              for t, l in ln:
                  if t == " ":
                      out.append(tgt[i+k])
                      k += 1
                  elif t == "-":
                      if norm(tgt[i+k]) != norm(l):
                          out.append(tgt[i+k])
                      k += 1
                  else:
                      out.append(l)
              tgt[i:i+len(old)] = out
              return "forced", score

          def proc(rej):
              tf = rej[:-4]
              if not os.path.isfile(tf):
                  return False
              with open(tf, encoding="utf-8", errors="surrogateescape") as fh:
                  tgt = fh.read().split("\n")
              bak = os.path.join(B, os.path.relpath(tf))
              os.makedirs(os.path.dirname(bak), exist_ok=True)
              shutil.copy2(tf, bak)
              ok, ch = True, False
              for h in p_rej(rej):
                  st, sc = app(tgt, h)
                  if st == "forced":
                      ch = True
                  elif st == "fail":
                      ok = False
              if ch:
                  with open(tf, "w", encoding="utf-8", errors="surrogateescape") as fh:
                      fh.write("\n".join(tgt))
              if ok:
                  os.replace(rej, rej + ".forced")
              return ok

          if __name__ == "__main__":
              results = [proc(r) for r in sys.argv[1:] if r.endswith(".rej")]
              sys.exit(0 if all(results) else 1)
          PY
          
          mapfile -t REJS < <(find . -name '*.rej' -not -path './susfs4ksu/*' | sort)
          if [ "${#REJS[@]}" -gt 0 ] && [ "$FORCE_HUNK" = "Enabled" ]; then python3 "$LOG_DIR/fh.py" "${REJS[@]}" || true; fi
          
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          rm -rf susfs4ksu
          grep -q 'susfs\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          
          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          for k in CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP; do
            sed -i -E "/^(# )?$k( is not set|=.*)\$/d" "$CFG"; echo "$k=y" >> "$CFG"
          done

      - name: "✍️ Kernel Identity & Governor"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          sed -i -E -e 's/^([[:space:]]*)LINUX_COMPILE_BY=.*/\1LINUX_COMPILE_BY="Dyatz"/' -e 's/^([[:space:]]*)LINUX_COMPILE_HOST=.*/\1LINUX_COMPILE_HOST="GitHub"/' scripts/mkcompile_h
          scripts/config --file "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL -d CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE -d CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND -d CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE -e CONFIG_CPU_FREQ_DEFAULT_GOV_WALT
          [ "${{ inputs.toolchain_type }}" = "android-tools" ] && echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile || true
          
      - name: "🔨 Build kernel (Android/Custom)"
        working-directory: ${{ env.WORK_DIR }}    
        run: |
          set -o pipefail
          if [ "${{ inputs.toolchain_type }}" = "android-tools" ]; then
            LTO=full BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log
          else
            cd ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
            make ARCH=arm64 LLVM=1 O=out "${{ env.DEFCONFIG_NAME }}"
            scripts/config --file out/.config -d LTO_CLANG_THIN -e LTO_CLANG_FULL
            make ARCH=arm64 LLVM=1 O=out olddefconfig
            make ARCH=arm64 LLVM=1 O=out -j"$(nproc --all)" Image 2>&1 | tee "$WORK_DIR/build_full.log"
          fi

      - name: "🚨 Kumpulkan Log Error"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ matrix.kernel.name }}
          path: |
            ${{ env.WORK_DIR }}/build_full.log
            ${{ env.WORK_DIR }}/out/.config
            ${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/*.rej
          retention-days: 3
          if-no-files-found: ignore
          
      - name: "📦 Prepare kernel image"
        working-directory: ${{ env.WORK_DIR }}
        run: |
           mkdir -p out/dist
           [ -n "${CLANG_PATH:-}" ] && echo "custom-tools" > out/dist/build_tools.txt || echo "android-tools" > out/dist/build_tools.txt
           [ "${{ inputs.toolchain_type }}" = "custom-tools" ] && src="${KERNEL_LOC_DIR}/${KERNEL_NAME}/out/arch/arm64/boot/Image" || src="out/dist/Image"
           cp "$src" "out/dist/${OUTPUT_NAME}"
           
      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

