name: Redmi 5 (rosy) Kernel 4.9 + BakaSU (AnyKernel3)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig kernel"
        required: true
        default: "rosy-perf_defconfig"
      fix_kallsyms:
        description: "Matikan KALLSYMS_BASE_RELATIVE (hanya jika link gagal soal kallsyms)"
        type: boolean
        default: false
  push:
    branches: [kernelsu-integration]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      KERNEL_DIR: kernel
      KERNEL_REPO: https://github.com/baunilla/android_kernel_xiaomi_rosy.git
      KERNEL_BRANCH: lineage-21.0
      DEFCONFIG: ${{ inputs.defconfig || 'rosy-perf_defconfig' }}
      FIX_KALLSYMS: ${{ inputs.fix_kallsyms && 'true' || 'false' }}
      # Satu tempat untuk semua argumen make (dipakai di step configure & build)
      KMAKE: >-
        make O=out ARCH=arm64
        CC=clang
        CLANG_TRIPLE=aarch64-linux-gnu-
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    steps:
      - name: 🧹 Bersihkan disk runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo docker builder prune -a -f || true
          df -h /

      - name: 📦 Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git \
            libssl-dev libncurses-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler python3 \
            unzip zip cpio curl ca-certificates

      - name: 🌟 Clone source kernel
        run: |
          git config --global http.postBuffer 524288000
          for i in 1 2 3; do
            rm -rf "$KERNEL_DIR"
            if git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"; then
              break
            fi
            echo "⚠️ Clone gagal, mencoba ulang ($i/3)..."
            sleep 5
          done
          [ -f "$KERNEL_DIR/Makefile" ] || { echo "❌ Clone kernel gagal"; exit 1; }
          [ -f "$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG" ] \
            || { echo "❌ Defconfig tidak ada: $DEFCONFIG"; ls "$KERNEL_DIR/arch/arm64/configs" | head -50; exit 1; }

      - name: 🛠️ Ambil Proton Clang
        run: |
          for i in 1 2 3; do
            rm -rf "$HOME/proton-clang"
            if git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"; then
              break
            fi
            echo "⚠️ Clone clang gagal, mencoba ulang ($i/3)..."
            sleep 5
          done
          [ -x "$HOME/proton-clang/bin/clang" ] || { echo "❌ Clang tidak ditemukan"; exit 1; }
          # PENTING: tambahkan di BELAKANG PATH, bukan di depan. Proton membawa
          # `ld` lama (binutils 2.3x) yang tidak bisa membaca glibc Ubuntu
          # terbaru (.relr.dyn). Kalau di depan, gcc host memakai ld itu dan
          # gagal saat link scripts/basic/fixdep.
          echo "PATH=$PATH:$HOME/proton-clang/bin" >> "$GITHUB_ENV"
          "$HOME/proton-clang/bin/clang" --version | head -n1

      - name: 👾 Pasang BakaSU ke kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          # Bersihkan sisa KernelSU lama (jika ada)
          sed -i '/kernelsu/d' drivers/Makefile
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          rm -rf drivers/kernelsu KernelSU

          # Clone tanpa blob supaya riwayat commit ada (dipakai untuk nomor versi)
          git clone --filter=blob:none https://github.com/Baka-SU/BakaSU.git KernelSU
          git -C KernelSU checkout main
          ln -sfn ../KernelSU/kernel drivers/kernelsu

          grep -q 'kernelsu' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          test -f drivers/kernelsu/Kconfig
          grep -n 'kernelsu' drivers/Makefile drivers/Kconfig

      - name: 🪝 Pasang hook manual KernelSU (kernel 4.9 non-GKI)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 - <<'PY'
          import re, sys

          def load(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()

          def save(p, s):
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(s)

          def patch(path, steps):
              s = load(path)
              for marker, fn in steps:
                  if marker in s:
                      print(f"= {path}: {marker} sudah ada, lewati")
                      continue
                  s2 = fn(s)
                  if s2 == s:
                      sys.exit(f"❌ {path}: anchor untuk '{marker}' tidak ditemukan")
                  s = s2
                  print(f"+ {path}: {marker}")
              save(path, s)

          def before(anchor, text):
              def f(s):
                  i = s.find(anchor)
                  return s if i < 0 else s[:i] + text + s[i:]
              return f

          def after_in_func(func_anchor, anchor, text):
              def f(s):
                  i = s.find(func_anchor)
                  if i < 0:
                      return s
                  j = s.find(anchor, i)
                  if j < 0:
                      return s
                  j += len(anchor)
                  return s[:j] + text + s[j:]
              return f

          def chain(*fns):
              def f(s):
                  for fn in fns:
                      s = fn(s)
                  return s
              return f

          # fs/exec.c
          patch("fs/exec.c", [("ksu_handle_execveat", chain(
              before("static int do_execveat_common(int fd, struct filename *filename,",
                     "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\n"),
              after_in_func("static int do_execveat_common(int fd, struct filename *filename,",
                            "\tint retval;\n\n",
                            "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\n")))])

          # fs/open.c
          patch("fs/open.c", [("ksu_handle_faccessat", chain(
              before("SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
                     "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags);\n\n"),
              after_in_func("SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
                            "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n",
                            "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\n")))])

          # fs/stat.c
          patch("fs/stat.c", [
              ("ksu_handle_stat", chain(
                  before("int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,",
                         "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                         "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
                         "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n\n"),
                  after_in_func("int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,",
                                "\tunsigned int lookup_flags = 0;\n\n",
                                "\tksu_handle_stat(&dfd, &filename, &flag);\n\n"))),
              ("ksu_handle_newfstat_ret(&fd", after_in_func(
                  "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)",
                  "\t\terror = cp_new_stat(&stat, statbuf);\n\n",
                  "\tksu_handle_newfstat_ret(&fd, &statbuf);\n")),
              ("ksu_handle_fstat64_ret(&fd", after_in_func(
                  "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)",
                  "\t\terror = cp_new_stat64(&stat, statbuf);\n\n",
                  "\tksu_handle_fstat64_ret(&fd, &statbuf);\n")),
          ])

          # kernel/reboot.c
          patch("kernel/reboot.c", [("ksu_handle_sys_reboot", chain(
              before("SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
                     "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n\n"),
              after_in_func("SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
                            "\tint ret = 0;\n\n",
                            "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n\n")))])
          PY

          echo "---- hasil patch ----"
          grep -n 'ksu_handle' fs/exec.c fs/open.c fs/stat.c kernel/reboot.c

      - name: 🔧 Fix KALLSYMS_BASE_RELATIVE (opsional)
        if: ${{ env.FIX_KALLSYMS == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Simbol ini tidak punya prompt, jadi harus diubah di Kconfig
          # SEBELUM defconfig dibuat (mengubahnya di .config tidak berefek).
          sed -i 's/default !IA64 && !(TILE && 64BIT)/default n/' init/Kconfig
          grep -n "config KALLSYMS_BASE_RELATIVE" -A4 init/Kconfig

      - name: ⚙️ Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          echo "ld host   : $(command -v ld)"
          echo "ld target : $(command -v aarch64-linux-gnu-ld)"
          echo "clang     : $(command -v clang)"
          $KMAKE "$DEFCONFIG"

          scripts/config --file "$OUT_DIR/.config" \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -d KSU_TRACEPOINT_HOOK \
            -d KSU_SUSFS
          $KMAKE olddefconfig

          echo "---- cek config akhir ----"
          for sym in KSU KSU_MANUAL_HOOK; do
            grep -qx "CONFIG_${sym}=y" "$OUT_DIR/.config" \
              || { echo "❌ CONFIG_${sym} tidak aktif di .config akhir"; exit 1; }
          done
          grep -E '^CONFIG_KSU|^CONFIG_KALLSYMS' "$OUT_DIR/.config"

      - name: 🔨 Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          $KMAKE -j"$(nproc --all)" Image.gz-dtb 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          test -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image.gz-dtb"

      - name: 📥 Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github

      - name: 🧩 Siapkan AnyKernel3
        run: |
          set -euo pipefail
          cp "$KERNEL_DIR/$OUT_DIR/arch/arm64/boot/Image.gz-dtb" AnyKernel3/

          # anykernel.sh bawaan AnyKernel3 berisi contoh Galaxy Nexus (BLOCK omap,
          # patch init.tuna.rc / fstab.tuna) yang akan merusak flash di Redmi 5.
          # Jadi ditulis ulang khusus flash kernel saja (ramdisk tidak diubah).
          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 - Redmi 5 (rosy) kernel + KernelSU
          properties() { '
          kernel.string=Redmi 5 (rosy) Kernel 4.9 + BakaSU
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=rosy
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot; # ramdisk tidak dibongkar
          flash_boot;
          EOF

          bash -n AnyKernel3/anykernel.sh
          ls AnyKernel3/Image.gz-dtb AnyKernel3/tools/ak3-core.sh

      - name: 🗜️ Paket zip AnyKernel3
        run: |
          cd AnyKernel3
          zip -r9 ../rosy-kernel-ksu.zip . -x '*.git*' 'README.md' '*placeholder'
          cd ..
          ls -lh rosy-kernel-ksu.zip

      - name: 📤 Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: rosy-kernel-ksu-anykernel3
          path: rosy-kernel-ksu.zip
          if-no-files-found: error

      - name: 📤 Upload log build (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
