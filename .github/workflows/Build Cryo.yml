name: "Build Cryo Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  workflow_dispatch:
     inputs:
      ksu_manager:
        description: "Root manager untuk varian KSU"
        type: choice
        options:
          - BakaSU    
          - BakaSU-susfs      
          - SukiSU-Ultra+KPM
          - KernelSU-Next-pershoot
          - KernelSU-Next 
          - KernelSU-Official
          - Rissu-KSU 
        default: "BakaSU-susfs"
      ksu_ref:
        description: "Opsional: branch/tag manager (kosong = bawaan tiap manager)"
        required: false
        default:  ""
      toolchain_type:
        description: "Pilih jenis Toolchain"
        type: choice
        options:
          - android-tools
          - custom-tools
        default: android-tools       
      customClangRepo:
        description: "Repo clang (HANYA DIPAKAI JIKA memilih 'custom-tools' di atas)"
        type: choice 
        options:
          - greenforce-project/greenforce_clang
          - Neutron-Toolchains/antman
        default: greenforce-project/greenforce_clang
      droidspaces_support: 
       description: "Add droidspaces proper support?"
       required: true
       type: choice
       default: "Enabled"
       options:
         - "Enabled"
         - "Disabled"    
      susfsSupport:
        description: "Add SUSFS Implementation?"
        required: true
        type: choice
        default: "Enabled"
        options:
          - "Enabled"
          - "Disabled"
      susfs_force_hunk:
       description: "Paksa hunk yang gagal agar sukses"
       required: true
       type: choice
       options:
         - Enabled
         - Disabled     
       default: 'Enabled'
      susfs_strict:
        description: "Hentikan build kalau integrasi SUSFS tidak sempurna"
        required: false
        default: false
        type: boolean
      susfs_commit:
        description: "Commit hash SUSFS4KSU (kosongkan untuk mengambil versi terbaru)"
        required: false
        type: string
        default: ""
      gaming_mode:
        description: "Gaming mode: Enabled = sertakan Vorpal governor + bias scheduler (fair.c); Disabled = kernel standar"
        type: choice
        options:
          - Disabled
          - Enabled
        default: Disabled
        
        
jobs:
  build-kernels:
    name: "❄️ Build Cryo ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r16-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r16-rel"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2  bc bison build-essential ca-certificates clang cpio curl dwarves flex gcc-aarch64-linux-gnu git libdw-dev libelf-dev libssl-dev lld llvm llvm-dev pkg-config python3 rsync unzip xz-utils zip  

      - name: 🔍 Check Space (Before Cleanup)
        run: |
          echo "Disk space before cleanup:"
          df -h /
          
      - name: 🧹 Aggressive Cleanup
        run: |
          # Remove heavy pre-installed tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Prune Docker to remove hidden images and build cache
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: 🔍 Check Space (After Cleanup)
        run: |
          echo "Disk space after cleanup:"
          df -h /
          
      - name: 📐 Setup SWAP 24GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 24
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          # Atur buffer git untuk mencegah early EOF
          git config --global http.postBuffer 524288000

           # Retry loop untuk clone (mencegah error putus koneksi sesaat)
          for i in {1..3}; do
            git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
              ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1 && break || {
              echo "⚠️ Clone gagal, mencoba ulang ($i/3)..."
              sleep 5
            }
          done
            
      - name: "📥 Initialize AOSP repo and toolchains"
        if: github.event.inputs.toolchain_type == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Konfigurasi global git untuk transfer file besar
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j2
          
          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-r596125
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "💫 Get Toolchains"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_REPO: ${{ github.event.inputs.customClangRepo }}
        run: |
          set -euo pipefail

          echo "📦 Mengunduh custom toolchain dari $CLANG_REPO..."
          
          # Ambil URL release asset (mendukung .tar.gz, .tar.xz, .zip, dsb)
          RELEASE_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$CLANG_REPO/releases/latest")
          clang_url=$(echo "$RELEASE_JSON" | grep -Eo 'https://[^\"]+\.(tar\.gz|tar\.xz|tar\.bz2|zip|tgz)' | head -n1 || true)

          [ -n "$clang_url" ] || { echo "::error::Release asset (tar/zip) tidak ditemukan di $CLANG_REPO"; exit 1; }
          echo "✅ Clang URL: $clang_url"

          rm -rf clang_toolchain
          mkdir -p clang_toolchain
          
          ARCHIVE_NAME=$(basename "$clang_url")
          wget -q --show-progress -O "$ARCHIVE_NAME" "$clang_url"

          echo "📦 Ekstraksi $ARCHIVE_NAME..."
          case "$ARCHIVE_NAME" in
            *.tar.gz|*.tgz|*.tar.xz|*.tar.bz2)
              tar -xf "$ARCHIVE_NAME" -C clang_toolchain
              ;;
            *.zip)
              unzip -q "$ARCHIVE_NAME" -d clang_toolchain
              ;;
            *)
              tar -xf "$ARCHIVE_NAME" -C clang_toolchain || unzip -q "$ARCHIVE_NAME" -d clang_toolchain
              ;;
          esac
          rm -f "$ARCHIVE_NAME"

          # Cari biner 'clang' (Mendukung file biasa -type f DAN symlink -type l)
          CLANG_EXEC=$(find clang_toolchain \( -type f -o -type l \) -name "clang" -path "*/bin/clang" | head -n1)
          if [ -z "$CLANG_EXEC" ]; then
            CLANG_EXEC=$(find clang_toolchain \( -type f -o -type l \) -name "clang" | head -n1)
          fi

          if [ -z "$CLANG_EXEC" ]; then
            echo "::error::Biner clang tidak ditemukan! Isi folder ekstraksi:"
            ls -la clang_toolchain
            exit 1
          fi

          CLANG_BIN_DIR=$(dirname "$CLANG_EXEC")
          CLANG_PATH="$(readlink -f "$CLANG_BIN_DIR")"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "$CLANG_PATH" >> "$GITHUB_PATH"

          echo "✅ Biner Clang ditemukan di: $CLANG_PATH"
          "$CLANG_PATH/clang" --version | head -n1

      - name: "😎 Set args for GKI kernels"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        id: generate-args
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
            args="-j$(nproc --all)"
            if [ -n "${{ env.OUT_DIR }}" ]; then
              mkdir -p $(pwd)/${{ env.OUT_DIR }}
              args="$args O=$(pwd)/${{ env.OUT_DIR }}"
            fi
            args="$args ARCH=arm64 LLVM=1 LTO=full"
            args="$args CROSS_COMPILE=aarch64-linux-gnu-"
            args="$args CLANG_TRIPLE=aarch64-linux-gnu-"
            args="$args AR=llvm-ar"
            args="$args CC=clang"
            echo "args=$args" >> $GITHUB_OUTPUT

      - name: "📝 Append custom Makefile line"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-sometimes-uninitialized' >> Makefile
         echo "Custom Makefile line added successfully"
             
      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Fix localversion
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' "$CONFIG_FILE" || true
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}\"" >> "$CONFIG_FILE"
          
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            
            # Cek apakah patch sudah terpasang (Logika pintar dari Claude)
            if patch -p1 -R --dry-run -s -f < "$file" > /dev/null 2>&1; then
              echo "✅ Sudah terpasang, dilewati: $file"
            else
              # Jika belum terpasang, paksa pasang. Jika gagal, HENTIKAN BUILD (Rem darurat)
              patch -p1 --batch < "$file" || { echo "::error::Hunks failed in $file (Konflik kode serius!)"; exit 1; }
              echo "✅ Berhasil dipasang: $file"
            fi
            rm -f "$file"
          }
          
          apply_patch "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"

          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while read p; do
            [ -n "$p" ] && apply_patch "$p"
          done
          
          # Use scripts/config for safe config manipulation
          scripts/config --file "$CONFIG_FILE" \
            -e CONFIG_KALLSYMS \
            -e CONFIG_TCP_CONG_ADVANCED \
            -d CONFIG_TCP_CONG_BIC \
            -d CONFIG_TCP_CONG_HTCP \
            -e CONFIG_TCP_CONG_WESTWOOD \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_TCP_CONG_BBR3 \
            -d CONFIG_DEFAULT_BBR \
            -e CONFIG_DEFAULT_BBR3 \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr3" \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_PM_WAKELOCKS \
            --set-val CONFIG_PM_WAKELOCKS_LIMIT 100 \
            -e CONFIG_PM_WAKELOCKS_GC \
            -e CONFIG_SUSPEND \
            -e CONFIG_SUSPEND_FREEZER \
            -e CONFIG_LRU_GEN \
            -e CONFIG_LRU_GEN_ENABLED \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_KERNEL_LZ4 \
            -e ZRAM_DEF_COMP_LZ4 \
            --set-str CONFIG_ZRAM_DEF_COMP "lz4" \
            -d CONFIG_KERNEL_GZIP \
            -d CONFIG_KERNEL_LZO \
            -d CONFIG_KERNEL_XZ \
            -d CONFIG_KERNEL_ZSTD \
            -d CONFIG_KERNEL_BZIP2 \
            -d CONFIG_KERNEL_UNCOMPRESSED \
            -d CONFIG_KPROFILES
          
          # Remove duplicate lines safely
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE" || true

      - name: "🚄 Apply BBRv3 + PLB"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          BBR3_SHA: 7bc9793d909f52f4a6cd45dd1381b2f200c18a7c
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/bbr3.patch \
            "https://github.com/topnotchfreaks/kernel_msm-5.15/commit/${BBR3_SHA}.patch"

          EXCL="--exclude=arch/arm64/configs/unified_defconfig"
          if ! git apply --check $EXCL /tmp/bbr3.patch; then
            echo "::error::Patch BBRv3 tidak cocok dengan ${KERNEL_BRANCH} (lihat hunk yang gagal di atas)"
            exit 1
          fi
          git apply -v $EXCL /tmp/bbr3.patch

          for f in net/ipv4/tcp_bbr3.c net/ipv4/tcp_plb.c; do
            [ -f "$f" ] || { echo "::error::$f tidak terbentuk"; exit 1; }
          done
          echo "✅ BBRv3 + PLB terpasang"
        
      - name: "🏷️ Force short localversion"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          VER="${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}"
          cat > scripts/setlocalversion << EOF
          #!/bin/sh
          # Cryo: fixed short localversion (ignore git tags/dirty)
          printf '%s' "$VER"
          EOF
          chmod +x scripts/setlocalversion
          rm -f .scmversion localversion*
          echo "Localversion: $VER"
                    
      - name: "🚀 Add Droidspaces Support (kABI patch + GKI defconfig)"
        if: github.event.inputs.droidspaces_support == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          DS_REF: main                  # branch/tag/commit Droidspaces-OSS
          DS_OPTIONAL_FEATURES: "true"  # IPv6 NAT, macvlan, UFW, Fail2ban, tmpfs xattr/ACL
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          DS_RAW="${DS_RAW:-https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/${DS_REF}/Documentation/resources/kernel-patches/GKI}"

          # --- 1. Pilih patch kABI sesuai versi kernel ---------------------------
          KVER=$(sed -n 's/^VERSION = //p' Makefile | head -n 1)
          KPL=$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n 1)
          [ -n "$KVER" ] && [ -n "$KPL" ] || die "Gagal membaca versi kernel dari Makefile"
          KNUM=$((KVER * 100 + KPL))
          echo "Kernel $KVER.$KPL"

          [ "$KNUM" -ge 504 ] || die "Droidspaces GKI membutuhkan kernel 5.4+ (terdeteksi $KVER.$KPL)"
          [ "$KNUM" -lt 612 ] || die "Kernel $KVER.$KPL memakai patch folder kernel-6.12 (belum didukung step ini)"

          PATCHES="below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          if [ "$KNUM" -le 510 ]; then
            # 5.10 ke bawah: POSIX mqueue juga perlu padding ABI Android
            PATCHES="$PATCHES below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          fi

          for p in $PATCHES; do
            f="/tmp/ds_$(basename "$p")"
            echo "📥 Mengunduh $p"
            curl -fsSL --retry 3 --retry-delay 5 -o "$f" "$DS_RAW/$p" \
              || die "Gagal mengunduh patch Droidspaces: $p"

            if git apply --check -R --ignore-whitespace "$f" >/dev/null 2>&1; then
              echo "✅ Sudah terpasang, dilewati: $p"
            else
              git apply -v --ignore-whitespace "$f" \
                || die "Droidspaces patch gagal diterapkan: $p"
              echo "✅ Berhasil dipasang: $p"
            fi
            rm -f "$f"
          done

          # --- 2. Edit gki_defconfig langsung (bukan fragment) -------------------
          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          [ -f "$CFG" ] || die "Defconfig tidak ditemukan: $CFG"

          # Wajib: IPC, namespace, devtmpfs, NAT
          REQUIRED="SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE"
          # Opsional tapi disarankan (aman untuk kABI bersama patch di atas)
          OPTIONAL="USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN
                    NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT
                    IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET
                    TMPFS_POSIX_ACL TMPFS_XATTR"
          [ "${DS_OPTIONAL_FEATURES:-true}" = "true" ] || OPTIONAL=""

          for o in $REQUIRED $OPTIONAL; do
            scripts/config --file "$CFG" -e "CONFIG_$o"
          done

          # --- 3. Verifikasi hasil ----------------------------------------------
          for o in $REQUIRED; do
            grep -q "^CONFIG_${o}=y" "$CFG" || die "CONFIG_${o} gagal diaktifkan di $CFG"
          done
          for o in $OPTIONAL; do
            grep -q "^CONFIG_${o}=y" "$CFG" || echo "::warning::CONFIG_${o} tidak aktif di $CFG"
          done

          # --- 4. Pengaman kABI: dua opsi ini JANGAN aktif di GKI ----------------
          # CFS_BANDWIDTH (--cpus) & CGROUP_PIDS (--pids-limit) mengubah CRC ribuan
          # simbol ekspor -> modul vendor ditolak -> bootloop. Tidak disentuh di sini.
          for o in CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -q "^CONFIG_${o}=y" "$CFG"; then
              echo "::warning::CONFIG_${o}=y terdeteksi di $CFG - berisiko merusak kABI (bootloop)"
            fi
          done

          echo "✅ Droidspaces: patch kABI + defconfig siap (kernel $KVER.$KPL)"background: background:

      - name: '⚙️ Inject Reflex Governor'
        if: github.event.inputs.gaming_mode == 'Enabled'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          REFLEX_REPO: kusonekoworld-max/KonekoKernel-GKI
          REFLEX_REF: refs/heads/main   # ganti ke commit SHA agar build reproducible
        run: |
          set -euo pipefail
          # Unduh aman: gagal jika 404/kosong, tampilkan sha256 (untuk pinning)
          fetch_src() {
            curl -fsSL --retry 3 --retry-delay 5 -o "$2" "$1" \
              || { echo "::error::Gagal mengunduh $1"; exit 1; }
            [ -s "$2" ] || { echo "::error::File kosong: $2"; exit 1; }
            echo "sha256 $(sha256sum "$2" | cut -d' ' -f1)  $2"
          }

          mkdir -p kernel/sched
          fetch_src "https://raw.githubusercontent.com/${REFLEX_REPO}/${REFLEX_REF}/.github/actions/build-kernel/patches/reflex/cpufreq_reflex.c" \
            kernel/sched/cpufreq_reflex.c

          if ! grep -q "cpufreq_reflex.o" "kernel/sched/Makefile"; then
            echo 'obj-$(CONFIG_CPU_FREQ_GOV_REFLEX) += cpufreq_reflex.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "config CPU_FREQ_GOV_REFLEX" "drivers/cpufreq/Kconfig"; then
            printf "\nconfig CPU_FREQ_GOV_REFLEX\n" >> "drivers/cpufreq/Kconfig"
            printf "\ttristate \"'reflex' cpufreq governor\"\n" >> "drivers/cpufreq/Kconfig"
            printf "\tdepends on CPU_FREQ && SMP\n" >> "drivers/cpufreq/Kconfig"
            printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "drivers/cpufreq/Kconfig"
            printf "\thelp\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  'reflex' is an advanced CPU frequency governor based on schedutil,\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  featuring idle-time accounting and PELT-complementary exponential decay.\n" >> "drivers/cpufreq/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ]; then
            if ! grep -q "CONFIG_CPU_FREQ_GOV_REFLEX" "$CONFIG_FILE"; then
              echo "CONFIG_CPU_FREQ_GOV_REFLEX=y" >> "$CONFIG_FILE"
            fi
          fi

          echo "🎉 Inject Reflex Governor setup complete!"

      - name: 'Inject Vorpal Governor + GKI510 Compat'
        if: github.event.inputs.gaming_mode == 'Enabled'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          VORPAL_REPO: yougotme101/KonekoKernel-GKI
          VORPAL_REF: refs/heads/main   # ganti ke commit SHA agar build reproducible
        run: |
          set -euo pipefail
          # Unduh aman: gagal jika 404/kosong, tampilkan sha256 (untuk pinning)
          fetch_src() {
            curl -fsSL --retry 3 --retry-delay 5 -o "$2" "$1" \
              || { echo "::error::Gagal mengunduh $1"; exit 1; }
            [ -s "$2" ] || { echo "::error::File kosong: $2"; exit 1; }
            echo "sha256 $(sha256sum "$2" | cut -d' ' -f1)  $2"
          }

          mkdir -p kernel/sched
          VBASE="https://raw.githubusercontent.com/${VORPAL_REPO}/${VORPAL_REF}/.github/actions/build-kernel/patches/vorpal"
          fetch_src "$VBASE/cpufreq_vorpal.c"      kernel/sched/cpufreq_vorpal.c
          fetch_src "$VBASE/rfx_gki510_compat.c"   kernel/sched/rfx_gki510_compat.c

          if ! grep -q "cpufreq_vorpal.o" "kernel/sched/Makefile"; then
            echo 'obj-$(CONFIG_CPU_FREQ_GOV_VORPAL) += cpufreq_vorpal.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "rfx_gki510_compat.o" "kernel/sched/Makefile"; then
            echo 'obj-y += rfx_gki510_compat.o' >> "kernel/sched/Makefile"
          fi

          if ! grep -q "config CPU_FREQ_GOV_VORPAL" "drivers/cpufreq/Kconfig"; then
            printf "\nconfig CPU_FREQ_GOV_VORPAL\n" >> "drivers/cpufreq/Kconfig"
            printf "\ttristate \"'vorpal' cpufreq governor\"\n" >> "drivers/cpufreq/Kconfig"
            printf "\tdepends on CPU_FREQ && SMP\n" >> "drivers/cpufreq/Kconfig"
            printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "drivers/cpufreq/Kconfig"
            printf "\thelp\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  'vorpal' is a schedutil-based governor tuned for\n" >> "drivers/cpufreq/Kconfig"
            printf "\t  gaming/thermal-aware dual-profile operation.\n" >> "drivers/cpufreq/Kconfig"
          fi

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [ -f "$CONFIG_FILE" ] && ! grep -q "CONFIG_CPU_FREQ_GOV_VORPAL" "$CONFIG_FILE"; then
            echo "CONFIG_CPU_FREQ_GOV_VORPAL=y" >> "$CONFIG_FILE"
          fi

          echo "✅ Vorpal governor + GKI510 compat terpasang"

      - name: 'Fix Vorpal Input-Handler Init Bug'
        if: github.event.inputs.gaming_mode == 'Enabled'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          VORPAL_C="kernel/sched/cpufreq_vorpal.c"

          if ! grep -q "bool input_ok;" "$VORPAL_C"; then
           perl -0pi -e 's{(static int __init vorpal_gov_init\(void\)\n\{\n\tint ret;\n)}{$1\tbool input_ok;\n}' "$VORPAL_C"
          fi

          if ! grep -q "input_ok = !input_register_handler" "$VORPAL_C"; then
            perl -0pi -e 's{\tif \(input_register_handler\(&rfx_input_handler\)\)\n\t\tpr_warn\("vorpal: input handler register failed \(touch boost off\)\\n"\);}{\tinput_ok = !input_register_handler(&rfx_input_handler);\n\tif (!input_ok)\n\t\tpr_warn("vorpal: input handler register failed (touch boost off)\\n");}' "$VORPAL_C"
          fi

          if ! grep -q "if (input_ok)" "$VORPAL_C"; then
            perl -0pi -e 's{\tret = cpufreq_register_governor\(&vorpal_gov\);\n\tif \(ret\) \{\n\t\tinput_unregister_handler\(&rfx_input_handler\);\n\t\tcancel_delayed_work_sync\(&rfx_thermal_work\);\n\t\}}{\tret = cpufreq_register_governor(&vorpal_gov);\n\tif (ret) \{\n\t\tif (input_ok)\n\t\t\tinput_unregister_handler(&rfx_input_handler);\n\t\tcancel_delayed_work_sync(&rfx_thermal_work);\n\t\}}' "$VORPAL_C"
          fi

          if ! grep -q "bool input_ok;" "$VORPAL_C"; then
            echo "ERROR: failed to inject 'bool input_ok;' into vorpal_gov_init()" >&2
            exit 1
          fi
          if ! grep -q "input_ok = !input_register_handler" "$VORPAL_C"; then
            echo "ERROR: failed to patch input_register_handler() call in vorpal_gov_init()" >&2
            exit 1
          fi
          if ! grep -q "if (input_ok)" "$VORPAL_C"; then
            echo "ERROR: failed to guard input_unregister_handler() in vorpal_gov_init() error path" >&2
            exit 1
          fi

      - name: 'Inject Vorpal Gaming-Mode Bias into fair.c'
        if: github.event.inputs.gaming_mode == 'Enabled'
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          FAIR_C="kernel/sched/fair.c"
          cp "$FAIR_C" "$FAIR_C.orig"   # cadangan untuk rollback bila ada pola yang tidak cocok

          if ! grep -q "extern int sched_gaming_active;" "$FAIR_C"; then
            perl -0pi -e 's{(static unsigned int normalized_sysctl_sched_latency\s*=\s*6000000ULL;)}{$1\n\nextern int sched_gaming_active;\n\n#define GAMING_VRUNTIME_STRETCH\t\t4\n}' "$FAIR_C"
          fi

          if ! grep -q "GAMING_VRUNTIME_STRETCH - 1" "$FAIR_C"; then
            perl -0pi -e 's{(\tcurr->vruntime \+= calc_delta_fair\(delta_exec, curr\);\n)(\tupdate_min_vruntime\(cfs_rq\);\n)}{$1\n\tif (unlikely(sched_gaming_active \&\& !entity_is_task(curr))) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec * (GAMING_VRUNTIME_STRETCH - 1), curr);\n\t} else if (unlikely(sched_gaming_active \&\& entity_is_task(curr) \&\&\n\t\t\t     curr->avg.load_avg < 100)) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec, curr);\n\t}\n$2}' "$FAIR_C"
          fi

          if ! grep -q "ideal_runtime / 2" "$FAIR_C"; then
            perl -0pi -e 's{(\tdelta_exec = curr->sum_exec_runtime - curr->prev_sum_exec_runtime;\n)(\ttrace_android_rvh_check_preempt_tick)}{$1\n\tif (unlikely(sched_gaming_active) \&\& entity_is_task(curr)) {\n\t\tstruct task_struct *p = task_of(curr);\n\n\t\tif (p->static_prio > DEFAULT_PRIO \&\&\n\t\t    delta_exec > ideal_runtime / 2)\n\t\t\tresched_curr(rq_of(cfs_rq));\n\t}\n\n$2}' "$FAIR_C"
          fi

          if ! grep -q "NSEC_PER_MSEC" "$FAIR_C"; then
            perl -0pi -e 's{(\tfor_each_sched_entity\(se\) \{\n\t\tcfs_rq = cfs_rq_of\(se\);\n\n)(\t\tupdate_load_avg\(cfs_rq, se, UPDATE_TG\);\n\t\tse_update_runnable\(se\);\n\t\tupdate_cfs_group\(se\);)}{$1\t\tif (unlikely(sched_gaming_active \&\& entity_is_task(se) \&\&\n\t\t\t     task_of(se)->static_prio <= DEFAULT_PRIO))\n\t\t\tse->vruntime -= min_t(u64, se->vruntime, NSEC_PER_MSEC);\n\n$2}' "$FAIR_C"
          fi

          if ! grep -q "Gaming task isolation" "$FAIR_C"; then
            perl -0pi -e 's{(\tdelta = rq_clock_task\(env->src_rq\) - p->se\.exec_start;\n\n)(\treturn delta < \(s64\)sysctl_sched_migration_cost;\n\}\n)}{$1\t/* Gaming task isolation */\n\tif (sched_gaming_active) {\n\t\tif (capacity_orig_of(env->dst_cpu) < capacity_orig_of(env->src_cpu) \&\&\n\t\t    task_util(p) > (capacity_orig_of(env->src_cpu) >> 3))\n\t\t\treturn 1;\n\t\treturn delta < (s64)sysctl_sched_migration_cost * 2;\n\t}\n\n$2}' "$FAIR_C"
          fi

          MISSING=""
          for MARK in "extern int sched_gaming_active;" "GAMING_VRUNTIME_STRETCH - 1" "ideal_runtime / 2" "NSEC_PER_MSEC" "Gaming task isolation"; do
            grep -qF "$MARK" "$FAIR_C" || MISSING="$MISSING [$MARK]"
          done

          if [ -n "$MISSING" ]; then
            # fair.c tiap tree berbeda (mis. CLO/WALT): jangan biarkan patch setengah jadi
            mv -f "$FAIR_C.orig" "$FAIR_C"
            echo "::warning::fair.c gaming bias DILEWATI (pola tidak cocok:$MISSING). Vorpal tetap terpasang tanpa bias scheduler."
          else
            rm -f "$FAIR_C.orig"
            echo "✅ fair.c gaming bias terpasang"
          fi
          
      - name: "😋 Add BBG Support"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          scripts/config --file arch/arm64/configs/${{ env.DEFCONFIG_NAME }} -e CONFIG_BBG
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          
      - name: "🔧 Add NoMount Support"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -
          
      - name: "⚔️ Setup root manager (${{ inputs.ksu_manager }})"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          # Kita petakan input dari GitHub Actions ke Environment Variable Bash dengan aman di sini
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          KSU_REF: ${{ inputs.ksu_ref }}
          # Tambahkan input untuk mengontrol SUSFS (bisa dari inputs GitHub Actions, default 'Enabled')
          ENABLE_SUSFS: ${{ inputs.susfsSupport || 'Enabled' }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          MULTI_MANAGER_PATCH="https://raw.githubusercontent.com/RapliVx/kernel_builder/refs/heads/main/patch/ksun-add-more-managers-support.patch"
          EXTRA_PATCH_URL=""

          # Konfigurasi per manager
          case "$KSU_MANAGER" in
            BakaSU)                 REPO="Baka-SU/BakaSU";              SETUP_BRANCH=main;      DEFAULT_REF=main;      NEED_SUSFS_PATCH=0 ;;
            BakaSU-susfs)           REPO="Baka-SU/BakaSU";              SETUP_BRANCH=main;      DEFAULT_REF=sync-susfs;NEED_SUSFS_PATCH=0 ;;
            SukiSU-Ultra+KPM)       REPO="SukiSU-Ultra/SukiSU-Ultra";   SETUP_BRANCH=main;      DEFAULT_REF=builtin-new;NEED_SUSFS_PATCH=0 ;;
            KernelSU-Next)          REPO="KernelSU-Next/KernelSU-Next"; SETUP_BRANCH=dev;       DEFAULT_REF="";        NEED_SUSFS_PATCH=1 ;;
            KernelSU-Next-pershoot) REPO="pershoot/KernelSU-Next";      SETUP_BRANCH=dev-susfs; DEFAULT_REF=dev-susfs; NEED_SUSFS_PATCH=0; EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH" ;;
            KernelSU-Official)      REPO="tiann/KernelSU";              SETUP_BRANCH=main;      DEFAULT_REF="";        NEED_SUSFS_PATCH=1; EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH" ;;
            Rissu-KSU)              REPO="rsuntk/KernelSU";             SETUP_BRANCH=main;      DEFAULT_REF="";        NEED_SUSFS_PATCH=1 ;;
            *) die "Fatal Error: Varian manager tidak dikenal: $KSU_MANAGER" ;;
          esac

          # Logika untuk menonaktifkan SUSFS jika diminta pengguna
            if [ "$ENABLE_SUSFS" = "Disabled" ]; then
               echo "ℹ️ Opsi SUSFS dinonaktifkan dari input. Mengabaikan kebutuhan patch SUSFS."
               NEED_SUSFS_PATCH=0
            fi

          REF="${KSU_REF:-$DEFAULT_REF}"
          SETUP_URL="https://raw.githubusercontent.com/${REPO}/${SETUP_BRANCH}/kernel/setup.sh"
          echo "Manager: $KSU_MANAGER | ref: ${REF:-latest release tag}"
          echo "Setup script: $SETUP_URL"

          # Hapus instalasi sebelumnya jika ada, lalu jalankan skrip setup
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -fsSL -o /tmp/ksu_setup.sh "$SETUP_URL" \
            || die "Fatal Error: Gagal mengunduh skrip setup dari $SETUP_URL"
            
          bash -x /tmp/ksu_setup.sh ${REF:+"$REF"} \
            || die "Fatal Error: Eksekusi setup.sh untuk $KSU_MANAGER gagal (ref: ${REF:-latest tag})"

          # Cek ketersediaan symlink drivers/kernelsu
          if [ ! -e drivers/kernelsu ]; then
            die "Fatal Error: Symlink drivers/kernelsu tidak ditemukan atau rusak setelah setup."
          fi
          
          # Ambil direktori asli dari root manager
          KSU_DIR=$(readlink -f drivers/kernelsu)
          echo "Install dir: $KSU_DIR"

          # Teruskan hasil ke langkah berikutnya
          {
            echo "KSU_DIR=$KSU_DIR"
            echo "NEED_SUSFS_PATCH=$NEED_SUSFS_PATCH"
            echo "EXTRA_PATCH_URL=$EXTRA_PATCH_URL"
            echo "KSU_REF_USED=${REF:-latest tag}"
          } >> "$GITHUB_ENV"

      - name: "🩹 Patch manager with SUSFS"
        if: matrix.kernel.enable_ksu == true && github.event.inputs.susfsSupport == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          SUSFS_BRANCH: gki-android13-5.15
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          # Meskipun input Enabled, kita cek apakah varian Root Manager butuh patch eksternal
          if [ "$NEED_SUSFS_PATCH" != 1 ]; then
            echo "✅ Varian $KSU_MANAGER sudah menggunakan SUSFS bawaan (built-in). Melewati proses patch manual."
            exit 0
          fi

          echo "Menerapkan patch SUSFS (branch: $SUSFS_BRANCH) ke $KSU_DIR"
          rm -rf /tmp/susfs4ksu
          ok=0
          for i in 1 2 3; do
            if git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu; then
              ok=1; break
            fi
            echo "⚠️ Percobaan clone SUSFS gagal ($i/3)... mencoba lagi."; rm -rf /tmp/susfs4ksu; sleep $((i*10))
          done
          
          [ "$ok" = 1 ] || die "Fatal Error: Gagal melakukan clone repositori susfs4ksu setelah 3 kali percobaan."

          PATCH_FILE=/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          [ -f "$PATCH_FILE" ] || die "Fatal Error: File patch SUSFS tidak ditemukan di $PATCH_FILE"
          
          echo "🔍 Menguji kompabilitas patch (simulasi/dry-run)..."
          # Kita lakukan dry-run terlebih dahulu (simulasi). Jika error, masuk ke blok 'else'
          if patch -d "$KSU_DIR" -p1 --forward --dry-run < "$PATCH_FILE" > /dev/null 2>&1; then
            echo "✅ Simulasi berhasil! Menerapkan patch sesungguhnya..."
            # Karena simulasi aman, kita terapkan secara nyata (hapus --dry-run)
            patch -d "$KSU_DIR" -p1 --forward --batch < "$PATCH_FILE" \
              || die "Fatal Error: Gagal saat menerapkan patch sesungguhnya."
            echo "✅ Patch SUSFS berhasil dipasang!"
          else
            die "Fatal Error: Uji coba patch gagal! Kode sumber Root Manager ($KSU_MANAGER) bentrok atau patch sudah pernah diterapkan secara berbeda. Proses dibatalkan dengan aman."
          fi
      
      - name: "🧩 Extra manager patch & enable KSU"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }} 
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          # Cek apakah varian manager ini memiliki ekstra patch yang harus diterapkan
          if [ -n "$EXTRA_PATCH_URL" ]; then
            echo "⚙️ Ekstra patch ditemukan untuk varian $KSU_MANAGER."
            echo "Mengunduh dari: $EXTRA_PATCH_URL"
            
            # Jika curl gagal (misal URL mati/404), script akan langsung batal (die)
            curl -fsSL -o /tmp/ksu_extra.patch "$EXTRA_PATCH_URL" \
              || die "Fatal Error: Gagal mengunduh ekstra patch dari URL tersebut!"
              
            echo "Menerapkan ekstra patch ke $KSU_DIR..."
            # Jika patch gagal diterapkan, script langsung batal (die)
            patch -d "$KSU_DIR" -p1 --forward --batch < /tmp/ksu_extra.patch \
              || die "Fatal Error: Ekstra patch gagal diterapkan pada $KSU_MANAGER (ref: $KSU_REF_USED)!"
              
            echo "✅ Ekstra patch berhasil diterapkan."
          else
            # Jika EXTRA_PATCH_URL kosong, lewati proses ekstra patch
            echo "✅ Tidak ada ekstra patch yang diperlukan untuk varian $KSU_MANAGER. Melanjutkan proses..."
          fi

          # Enable KernelSU in the defconfig
          CONFIG_PATH="arch/arm64/configs/$DEFCONFIG_NAME"
          if [ ! -f "$CONFIG_PATH" ]; then
             die "Fatal Error: File Defconfig tidak ditemukan di $CONFIG_PATH. Periksa konfigurasi DEFCONFIG_NAME."
          fi
          
          echo "Mengaktifkan CONFIG_KSU pada defconfig $DEFCONFIG_NAME..."
          scripts/config --file "$CONFIG_PATH" -e CONFIG_KSU

          # KPM hanya untuk varian "SukiSU-Ultra+KPM"
          KPM_STATE=""
          if [ "$KSU_MANAGER" = "SukiSU-Ultra+KPM" ]; then
            grep -qE '^\s*config\s+KPM\b' "$KSU_DIR/kernel/Kconfig" \
              || die "Fatal Error: Ref SukiSU ini ($KSU_REF_USED) tidak punya CONFIG_KPM. Pakai ref lain atau pilih SukiSU-Ultra."
            echo "Mengaktifkan CONFIG_KPM..."
            scripts/config --file "$CONFIG_PATH" -e CONFIG_KPM
            KPM_STATE="aktif"
          else
            echo "ℹ️ KPM dilewati (hanya untuk varian SukiSU-Ultra+KPM)."
          fi

          VER=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo Unknown)
          echo "✅ $KSU_MANAGER setup selesai dengan versi: $VER"
          {
            echo "- Root manager: **$KSU_MANAGER** ($VER)"
            if [ -n "$KPM_STATE" ]; then echo "- KPM: $KPM_STATE"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🚀 Inject SUSFS Integration"
        if: matrix.kernel.enable_ksu == true && github.event.inputs.susfsSupport == 'Enabled'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          FORCE_HUNK: ${{ github.event.inputs.susfs_force_hunk || 'Enabled' }}
          SUSFS_STRICT: ${{ github.event.inputs.susfs_strict || 'false' }}
        run: |
          set -euo pipefail
          : "${DEFCONFIG_NAME:?DEFCONFIG_NAME belum di-set}"

          LOG_DIR="${RUNNER_TEMP:-/tmp}/susfs_logs"
          mkdir -p "$LOG_DIR"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_BRANCH="gki-android13-5.15"

          # ───────────────────────── 1. Clone SUSFS4KSU (retry, tanpa `break` liar) ─────────────────────────
          echo "📦 Menyiapkan repositori SUSFS4KSU..."
          clone_susfs() {
            local i
            for i in 1 2 3; do
              rm -rf susfs4ksu
              if [ -n "${SUSFS_COMMIT:-}" ]; then
                echo "Menerapkan SUSFS4KSU pada commit spesifik: $SUSFS_COMMIT"
                if git clone -q -b "$SUSFS_BRANCH" "$SUSFS_URL" susfs4ksu \
                   && git -C susfs4ksu checkout -q "$SUSFS_COMMIT"; then
                  return 0
                fi
              else
                echo "Input commit kosong, mengambil versi terbaru (latest)..."
                if git clone -q --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_URL" susfs4ksu; then
                  return 0
                fi
              fi
              echo "⚠️ Clone SUSFS4KSU gagal ($i/3)"
              sleep $((i * 5))
            done
            return 1
          }
          clone_susfs || { echo "::error::Gagal clone/checkout SUSFS4KSU"; exit 1; }
          SUSFS_HEAD=$(git -C susfs4ksu rev-parse --short HEAD)
          echo "SUSFS4KSU @ $SUSFS_HEAD"

          PDIR="susfs4ksu/kernel_patches"
          SUSFS_KERNEL_PATCH="$PDIR/50_add_susfs_in_gki-android13-5.15.patch"
          for f in "$SUSFS_KERNEL_PATCH" "$PDIR/fs/susfs.c" "$PDIR/include/linux/susfs.h"; do
            [ -f "$f" ] || { echo "::error::File wajib tidak ada di repo SUSFS4KSU: $f"; exit 1; }
          done

          # ───────────────────────── 2. Fake patch (agar konteks hunk cocok) ─────────────────────────
          NS_FAKE_PATCHED=0
          MM_FAKE_PATCHED=0
          echo "☣️ Applying namespace.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            echo "ℹ️ blk.h include tidak ada di fs/namespace.c, fake patch dilewati"
          fi
          echo "☣️ Applying task_mmu.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            echo "ℹ️ mm.h include tidak ada di fs/proc/task_mmu.c, fake patch dilewati"
          fi

          # ───────────────────────── 3. Terapkan patch kernel SUSFS ─────────────────────────
          echo "🔧 Applying SUSFS kernel patch..."
          find . -name '*.rej' -not -path './susfs4ksu/*' -delete
          if patch -p1 -R --dry-run -s < "$SUSFS_KERNEL_PATCH" > /dev/null 2>&1; then
            echo "ℹ️ Patch sudah terpasang sebelumnya, dilewati"
          else
            # Fuzz 0 (BUKAN -F3): fuzz tinggi terbukti bisa menempatkan hunk di fungsi yang SALAH
            # (hasil pengujian: menyisipkan pemanggilan fungsi dengan parameter yang tidak ada di
            # scope tersebut, lolos tanpa .rej tapi kodenya salah dan gagal kompilasi membingungkan).
            # -l mengabaikan whitespace, --forward melewati hunk yang sudah terpasang.
            patch -p1 --forward -F0 -l --no-backup-if-mismatch < "$SUSFS_KERNEL_PATCH" 2>&1 | tee "$LOG_DIR/patch.log" || true
          fi

          # ───────────────────────── 4. Force hunk yang gagal ─────────────────────────
          cat > "$LOG_DIR/force_hunk.py" << 'PY'
          #!/usr/bin/env python3
          """Paksa terapkan hunk dari file .rej dengan pencocokan fuzzy (abaikan whitespace)."""
          import os, re, shutil, sys

          THRESHOLD = float(os.environ.get("FORCE_THRESHOLD", "0.5"))
          BACKUP = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "susfs_backup")


          def norm(s):
              return " ".join(s.split())


          def parse_rej(path):
              hunks, cur = [], None
              with open(path, encoding="utf-8", errors="surrogateescape") as fh:
                  for raw in fh.read().split("\n"):
                      m = re.match(r"^@@ -(\d+)(?:,\d+)? \+\d+(?:,\d+)? @@", raw)
                      if m:
                          cur = {"start": int(m.group(1)), "lines": []}
                          hunks.append(cur)
                      elif cur is not None and raw[:1] in (" ", "+", "-"):
                          cur["lines"].append((raw[0], raw[1:]))
              return hunks


          def locate(tgt_n, old_n, hint):
              idx = [k for k, s in enumerate(old_n) if s]
              if not idx or len(tgt_n) < len(old_n):
                  return None, 0.0, 0
              need = min(2, len(idx))
              best_i, best_s, best_h = None, 0.0, 0
              for i in range(len(tgt_n) - len(old_n) + 1):
                  hits = 0
                  for k in idx:
                      if tgt_n[i + k] == old_n[k]:
                          hits += 1
                  if hits < need:
                      continue
                  s = hits / len(idx) - abs(i - hint) / (len(tgt_n) * 100.0)
                  if s > best_s:
                      best_i, best_s, best_h = i, s, hits
              return best_i, best_s, best_h


          def apply_hunk(tgt, hunk):
              lines = hunk["lines"]
              old = [l for t, l in lines if t in " -"]
              added = [l for t, l in lines if t == "+"]
              tgt_n = [norm(x) for x in tgt]
              distinct = [norm(a) for a in added if len(norm(a)) > 12]
              if distinct and all(a in set(tgt_n) for a in distinct):
                  return "already", 0.0
              if not old:
                  return "fail", 0.0
              i, score, hits = locate(tgt_n, [norm(x) for x in old], hunk["start"] - 1)
              if i is None or score < THRESHOLD * 0.9:
                  return "fail", score
              out, k = [], 0
              for t, l in lines:
                  if t == " ":
                      out.append(tgt[i + k])
                      k += 1
                  elif t == "-":
                      if norm(tgt[i + k]) != norm(l):
                          out.append(tgt[i + k])  # tidak cocok: jangan hapus baris yang salah
                      k += 1
                  else:
                      out.append(l)
              tgt[i:i + len(old)] = out
              return "forced", score


          def process(rej):
              target = rej[:-4]
              if not os.path.isfile(target):
                  print(f"FAIL   {rej}: file target tidak ada")
                  return False
              with open(target, encoding="utf-8", errors="surrogateescape", newline="") as fh:
                  tgt = fh.read().split("\n")
              rel = os.path.relpath(target)
              bak = os.path.join(BACKUP, rel)
              if not os.path.exists(bak):
                  os.makedirs(os.path.dirname(bak), exist_ok=True)
                  shutil.copy2(target, bak)
              ok, changed = True, False
              for n, h in enumerate(parse_rej(rej), 1):
                  status, score = apply_hunk(tgt, h)
                  print(f"{status.upper():7s}{rel} hunk#{n} (baris ~{h['start']}, skor {score:.2f})")
                  if status == "forced":
                      changed = True
                  elif status == "fail":
                      ok = False
              if changed:
                  with open(target, "w", encoding="utf-8", errors="surrogateescape", newline="") as fh:
                      fh.write("\n".join(tgt))
              if ok:
                  os.replace(rej, rej + ".forced")
              return ok


          if __name__ == "__main__":
              results = [process(r) for r in sys.argv[1:] if r.endswith(".rej")]
              sys.exit(0 if all(results) else 1)
          PY

          mapfile -t REJS < <(find . -name '*.rej' -not -path './susfs4ksu/*' | sort)
          FORCE_FAILED=0
          if [ "${#REJS[@]}" -gt 0 ]; then
            echo "⚠️ ${#REJS[@]} file .rej ditemukan: ${REJS[*]}"
            if [ "$FORCE_HUNK" = "Enabled" ]; then
              echo "💪 Force hunk aktif, mencoba menerapkan hunk yang gagal..."
              python3 "$LOG_DIR/force_hunk.py" "${REJS[@]}" 2>&1 | tee "$LOG_DIR/force.log" || FORCE_FAILED=1
            else
              echo "ℹ️ Force hunk dimatikan (FORCE_HUNK=$FORCE_HUNK)"
              FORCE_FAILED=1
            fi
          else
            echo "✅ Semua hunk patch SUSFS terpasang tanpa reject"
          fi

          # ───────────────────────── 5. Salin source SUSFS + wiring build ─────────────────────────
          echo "📄 Forcing SUSFS source injection..."
          mkdir -p fs include/linux
          cp -f "$PDIR/fs/susfs.c" fs/susfs.c
          cp -f "$PDIR/include/linux/susfs.h" include/linux/susfs.h
          if [ -f "$PDIR/include/linux/susfs_def.h" ]; then
            cp -f "$PDIR/include/linux/susfs_def.h" include/linux/susfs_def.h
          else
            echo "⚠️ susfs_def.h tidak ada di repo SUSFS4KSU"
          fi
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done
          rm -rf susfs4ksu

          if ! grep -q 'susfs\.o' fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            echo "✔ susfs.o ditambahkan ke fs/Makefile"
          fi

          if [ -d KernelSU ] && [ ! -e drivers/kernelsu ]; then
            ln -s ../KernelSU drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          # ───────────────────────── 6. Pastikan header SUSFS ter-include di file yang dipatch ─────────────────────────
          insert_include() {
            local f="$1" inc="$2" ln
            ln=$(awk 'NR<=250 && /^#include/ {n=NR} END {print n+0}' "$f")
            if [ "$ln" -le 0 ]; then echo "⚠️ Tidak ada #include di $f"; return 1; fi
            awk -v ln="$ln" -v inc="$inc" '{print} NR==ln {print "#ifdef CONFIG_KSU_SUSFS"; print "#include <" inc ">"; print "#endif"}' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
            echo "✔ Menambahkan #include <$inc> ke $f"
          }

          mapfile -t PATCHED < <(grep -E '^\+\+\+ b/' "$SUSFS_KERNEL_PATCH" | sed -E 's#^\+\+\+ b/##; s#[[:space:]].*$##' | sort -u || true)
          for f in "${PATCHED[@]}"; do
            case "$f" in *.c) ;; *) continue ;; esac
            [ -f "$f" ] || continue
            if grep -qE 'susfs_|CONFIG_KSU_SUSFS|CL_COPY_MNT_NS|DEFAULT_KSU_MNT' "$f"; then
              grep -q 'linux/susfs_def.h' "$f" || insert_include "$f" "linux/susfs_def.h" || true
              if grep -qE '\bsusfs_[a-z0-9_]+\(' "$f"; then
                grep -q 'linux/susfs.h' "$f" || insert_include "$f" "linux/susfs.h" || true
              fi
            fi
          done

          # ───────────────────────── 7. Konfigurasi defconfig (tanpa duplikat/konflik) ─────────────────────────
          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"
          [ -f "$CONFIG_FILE" ] || { echo "::error::defconfig tidak ada: $CONFIG_FILE"; exit 1; }
          if [ -n "$(tail -c1 "$CONFIG_FILE")" ]; then echo >> "$CONFIG_FILE"; fi

          set_cfg() {
            sed -i -E "/^(# )?$1( is not set|=.*)\$/d" "$CONFIG_FILE"
            printf '%s=%s\n' "$1" "$2" >> "$CONFIG_FILE"
          }
          SUSFS_CFGS=(
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MOUNT
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_KSU_SUSFS_SPOOF_UNAME
            CONFIG_KSU_SUSFS_ENABLE_LOG
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            CONFIG_KSU_SUSFS_OPEN_REDIRECT
            CONFIG_KSU_SUSFS_SUS_MAP
          )
          for k in "${SUSFS_CFGS[@]}"; do
            set_cfg "$k" y
            if ! grep -rqsE --include='Kconfig*' "^config[[:space:]]+${k#CONFIG_}\b" fs kernel KernelSU drivers/kernelsu; then
              echo "::warning::Simbol ${k#CONFIG_} tidak ditemukan di Kconfig (opsi ini akan diabaikan saat olddefconfig)"
            fi
          done
          echo "✅ KSU configs added"

          # ───────────────────────── 8. Kembalikan fake patch ─────────────────────────
          echo "↩️ Reverting namespace.c Fake Patch (if applicable)"
          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            if grep -q '^#include "internal.h"$' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
              echo "✔ Restored blk.h include"
            else
              echo "::warning::Anchor #include \"internal.h\" tidak ditemukan, blk.h tidak bisa dikembalikan otomatis"
            fi
          fi
          echo "↩️ Reverting task_mmu.c Fake Patch (if applicable)"
          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            if grep -q '^#include <linux/pkeys.h>$' fs/proc/task_mmu.c; then
              sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
              echo "✔ Restored mm.h include"
            else
              echo "::warning::Anchor #include <linux/pkeys.h> tidak ditemukan, mm.h tidak bisa dikembalikan otomatis"
            fi
          fi

          # ───────────────────────── 9. Verifikasi akhir ─────────────────────────
          BAD=0
          for f in "${PATCHED[@]}"; do
            [ -f "$f" ] || continue
            case "$f" in *.c|*.h) ;; *) continue ;; esac
            n_if=$(grep -cE '^[[:space:]]*#[[:space:]]*if(def|ndef)?\b' "$f" || true)
            n_end=$(grep -cE '^[[:space:]]*#[[:space:]]*endif\b' "$f" || true)
            if [ "$n_if" != "$n_end" ]; then
              echo "::error::#if/#endif tidak seimbang di $f ($n_if vs $n_end), kemungkinan hasil force hunk salah tempat"
              BAD=1
            fi
          done

          mapfile -t LEFT < <(find . -name '*.rej' -not -path './susfs4ksu/*' | sort)
          if [ "${#LEFT[@]}" -gt 0 ]; then
            BAD=1
            for r in "${LEFT[@]}"; do
              echo "::warning::Hunk belum terselesaikan: $r"
              echo "--- $r ---"; cat "$r"
            done
          fi

          {
            echo "### SUSFS Integration"
            echo "- SUSFS4KSU: \`$SUSFS_HEAD\`"
            echo "- Force hunk: \`$FORCE_HUNK\`"
            [ -f "$LOG_DIR/force.log" ] && { echo '```'; cat "$LOG_DIR/force.log"; echo '```'; }
            echo "- Hunk tersisa: ${#LEFT[@]}"
          } >> "$SUMMARY" || true

          if [ "$BAD" = "1" ]; then
            if [ "$SUSFS_STRICT" = "true" ]; then
              echo "::error::Masih ada masalah SUSFS dan SUSFS_STRICT=true, build dihentikan"
              exit 1
            fi
            echo "::warning::Ada masalah SUSFS tersisa, build dilanjutkan (SUSFS_STRICT=false)"
          fi

          echo "🎉 SUSFS Integration setup complete!"
                  
      - name: "📝 Append custom Makefile line"
        if: github.event.inputs.toolchain_type == 'android-tools'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         
      - name: "✍️ Set kernel build identity"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          F=scripts/mkcompile_h
          [ -f "$F" ] || { echo "::error::$F tidak ditemukan"; exit 1; }
          if ! grep -qE '^[[:space:]]*LINUX_COMPILE_(BY|HOST)=' "$F"; then
            echo "::error::Tidak ada penulisan LINUX_COMPILE_BY/HOST di $F"; exit 1
          fi

          # Baris yang menulis identitas tapi belum bernilai Dyatz / GitHub
          BAD=$(grep -E '^[[:space:]]*LINUX_COMPILE_(BY|HOST)=' "$F" \
            | grep -vE 'LINUX_COMPILE_BY="Dyatz"$|LINUX_COMPILE_HOST="GitHub"$' || true)

          if [ -z "$BAD" ]; then
            echo "⏭️ Identitas kernel sudah sesuai (Dyatz @ GitHub), proses dilewati (skip)."
          else
            echo "🔄 Memperbarui identitas kernel..."
            sed -i -E \
              -e 's/^([[:space:]]*)LINUX_COMPILE_BY=.*/\1LINUX_COMPILE_BY="Dyatz"/' \
              -e 's/^([[:space:]]*)LINUX_COMPILE_HOST=.*/\1LINUX_COMPILE_HOST="GitHub"/' "$F"

            BAD=$(grep -E '^[[:space:]]*LINUX_COMPILE_(BY|HOST)=' "$F" \
              | grep -vE 'LINUX_COMPILE_BY="Dyatz"$|LINUX_COMPILE_HOST="GitHub"$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::Identitas kernel belum sesuai:"; echo "$BAD"; exit 1
            fi
            echo "✅ Identitas kernel berhasil diubah."
          fi

          # Tampilkan hasilnya sebagai bukti
          grep -nE "LINUX_COMPILE_(BY|HOST)" "$F"

      - name: "⚖️ Set CPU Governor to Default (walt)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          # Pastikan variabel DEFCONFIG_NAME sudah tersedia di environment
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }} 
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          # Menentukan lokasi file konfigurasi kernel
          CONFIG_PATH="arch/arm64/configs/$DEFCONFIG_NAME"
          
          if [ ! -f "$CONFIG_PATH" ]; then
             die "Fatal Error: File Defconfig tidak ditemukan di $CONFIG_PATH."
          fi

          echo "⚙️ Mengubah CPU Governor default menjadi 'walt' (Balanced)..."

          # 1. Pastikan governor schedutil ikut di-build ke dalam kernel
          scripts/config --file "$CONFIG_PATH" -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL

          # 2. Matikan governor lain agar tidak menjadi default
          scripts/config --file "$CONFIG_PATH" -d CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE
          scripts/config --file "$CONFIG_PATH" -d CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND
          scripts/config --file "$CONFIG_PATH" -d CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE

          # 3. Jadikan schedutil sebagai governor default utama
          scripts/config --file "$CONFIG_PATH" -e CONFIG_CPU_FREQ_DEFAULT_GOV_WALT

          echo "✅ CPU Governor berhasil disetel ke 'walt' pada file $DEFCONFIG_NAME!"
          
      - name: "🔨 Build kernel"
        if: github.event.inputs.toolchain_type == 'android-tools'
        working-directory: ${{ env.WORK_DIR }}    
        run: |
          set -o pipefail
          
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log

      - name: "👍 Make defconfig"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          clang --version | head -n1
          make ARCH=arm64 LLVM=1 O=out "$DEFCONFIG_NAME"
          # samakan dengan jalur build.sh (LTO=full)
          scripts/config --file out/.config -d LTO_CLANG_THIN -e LTO_CLANG_FULL
          make ARCH=arm64 LLVM=1 O=out olddefconfig
          # Pastikan config penting tidak hilang setelah resolusi dependensi
          CHECK_LIST="CONFIG_KSU CONFIG_LTO_CLANG_FULL CONFIG_KPROFILES CONFIG_TCP_CONG_BBR3 CONFIG_FB"
          [ "$KSU_MANAGER" = "SukiSU-Ultra+KPM" ] && CHECK_LIST="$CHECK_LIST CONFIG_KPM"

          {
            echo "### Cek .config akhir"
            for c in $CHECK_LIST; do
              if grep -q "^${c}=y" out/.config; then
                echo "- ✅ \`$c=y\`"
              else
                echo "- ⚠️ \`$c\` TIDAK aktif"
                echo "::warning::$c tidak aktif di .config akhir"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          
      - name: "🎶 Build kernel"
        if: github.event.inputs.toolchain_type == 'custom-tools'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KBUILD_BUILD_USER: dyatz
          KBUILD_BUILD_HOST: GitHub
        run: |
          set -o pipefail
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc --all)" Image 2>&1 | tee "$WORK_DIR/build_full.log"
                                  
      - name: "🚨 Kumpulkan Log Error (Jika Gagal)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ matrix.kernel.name }}
          path: |
            ${{ env.WORK_DIR }}/build_full.log
            ${{ env.WORK_DIR }}/out/.config
            ${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/*.rej
          retention-days: 3
          if-no-files-found: ignore
          
      - name: "📦 Prepare kernel image"
        working-directory: ${{ env.WORK_DIR }}
        run: |
           set -euo pipefail
           mkdir -p out/dist
           if [ "${{ github.event.inputs.toolchain_type }}" = "custom-tools" ]; then
             # If CLANG_PATH was set earlier in this job it will be available
             if [ -n "${CLANG_PATH:-}" ]; then
               echo "custom-tools ($(basename "$CLANG_PATH"))" > out/dist/build_tools.txt
             else
               # fallback: try system clang
               clang --version 2>/dev/null | head -n1 > out/dist/build_tools.txt || echo "custom-tools (unknown clang)" > out/dist/build_tools.txt
             fi
           else
             echo "android-tools (clang-r547379)" > out/dist/build_tools.txt
           fi

           if [ "${{ github.event.inputs.toolchain_type }}" = "custom-tools" ]; then
             src="${KERNEL_LOC_DIR}/${KERNEL_NAME}/out/arch/arm64/boot/Image"
           else
             src="out/dist/Image"        # hasil build/build.sh
           fi
           [ -f "$src" ] || { echo "::error::Image tidak ditemukan: $src"; exit 1; }
           cp "$src" "out/dist/${OUTPUT_NAME}"
           ls -lh "out/dist/${OUTPUT_NAME}"
           # show build_tools for debugging
           echo "Build tools recorded:"
           cat out/dist/build_tools.txt || true
           
      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

      - name: 🔍 Check Space (Post-Build)
        if: always() # Run even if build fails to debug space issues
        run: |
          echo "Final disk space status:"
          df -h /
               
