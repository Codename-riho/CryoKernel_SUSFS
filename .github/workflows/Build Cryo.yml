          |            ##_   "##_    "##"    _##"   _##         |
          |             "##_   ##_  _ ## _  _##   _##"          |
          |               ########__######__########            |
          |                       _########_                    |
          |                       "########"                    |
          |               ########""######""########            |
          |             _##"   ##"  " ## "  "##   "##_          |
          |            ##"   _##"    _##_    "##_   "##         |
          |          _#########"    _####_    "#########_       |
          |          """           ##"  "##           """       |
          |                        ##_  _##                     |
