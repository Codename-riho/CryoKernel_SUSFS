name: 🔄 Upstream Kernel AOSP

on:
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: "Branch/tag upstream di android.googlesource.com/kernel/common"
        required: true
        default: "android13-5.15-lts"
      base_branch:
        description: "Branch snapshot upstream di repo ini (hasil Import Kernel AOSP)"
        required: true
        default: "android13-5.15-lts"
      target_branch:
        description: "Branch tujuan upstream"
        required: true
        default: "cryo_gki"

permissions:
  contents: write

jobs:
  upstream:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      AOSP_URL: "https://android.googlesource.com/kernel/common"
      AOSP_REF: ${{ inputs.aosp_ref }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          path: work

      - name: 📥 Clone upstream AOSP
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            echo "📥 Clone $AOSP_REF (percobaan $i/3)"
            if git clone --depth=1 --single-branch --branch "$AOSP_REF" "$AOSP_URL" aosp; then
              ok=1; break
            fi
            rm -rf aosp; sleep 15
          done
          [ "$ok" = 1 ] || { echo "❌ Clone gagal setelah 3x percobaan"; exit 1; }

      - name: 🔄 Buat snapshot dan merge ke target
        run: |
          set -euo pipefail
          cd work

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          kver() {
            git show "$1:Makefile" \
              | awk '/^VERSION =/{v=$3} /^PATCHLEVEL =/{p=$3} /^SUBLEVEL =/{s=$3} END{print v"."p"."s}'
          }

          git rev-parse --verify -q "origin/$BASE_BRANCH" >/dev/null \
            || { echo "❌ Branch $BASE_BRANCH tidak ada di repo ini"; exit 1; }
          BASE_SHA="$(git rev-parse "origin/$BASE_BRANCH")"
          git merge-base --is-ancestor "$BASE_SHA" HEAD \
            || { echo "❌ $BASE_BRANCH bukan leluhur $TARGET_BRANCH (history tidak nyambung)"; exit 1; }

          SRC_SHA="$(git -C ../aosp rev-parse --short HEAD)"
          OLD_VER="$(kver "$BASE_SHA")"

          # 1) Snapshot upstream terbaru di atas snapshot lama
          git checkout -q -B snapshot "$BASE_SHA"
          rsync -a --delete --exclude=/.git ../aosp/ ./
          git add -A -f
          if git diff --cached --quiet; then
            echo "ℹ️ $BASE_BRANCH sudah sama dengan upstream $AOSP_REF ($SRC_SHA)"
          else
            git commit -q -m "Upstream kernel/common $AOSP_REF @ $SRC_SHA" \
                           -m "Source: $AOSP_URL"
            git push origin "snapshot:refs/heads/$BASE_BRANCH"
          fi

          # 2) Merge snapshot ke target
          git checkout -q "$TARGET_BRANCH"
          if git merge-base --is-ancestor snapshot HEAD; then
            echo "✅ $TARGET_BRANCH sudah memuat upstream terbaru"
            exit 0
          fi

          if ! git merge --no-ff -m "Merge upstream $AOSP_REF ($SRC_SHA) into $TARGET_BRANCH" snapshot; then
            echo "❌ Konflik di file berikut:"
            git diff --name-only --diff-filter=U
            echo "ℹ️ Snapshot sudah ada di $BASE_BRANCH. Selesaikan di lokal:"
            echo "   git checkout $TARGET_BRANCH && git merge origin/$BASE_BRANCH"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          {
            echo "### 🔄 Upstream Kernel AOSP"
            echo "- Sumber: \`$AOSP_URL\` (\`$AOSP_REF\` @ \`$SRC_SHA\`)"
            echo "- Versi kernel: \`$OLD_VER\` → \`$(kver HEAD)\`"
            echo "- Snapshot: \`$BASE_BRANCH\`"
            echo "- Target: \`$TARGET_BRANCH\` @ \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
