name: GKI 5.15 Mirror Sync

on:
  workflow_dispatch:

permissions: 
  contents: write

concurrency:
  group: gki-mirror
  cancel-in-progress: false

env:
  UPSTREAM_URL: "https://android.googlesource.com/kernel/common"
  TARGET_BRANCH: "android13-5.15"

jobs:
  mirror:
    name: "🔄 Mirror ${{ github.event_name == 'schedule' && '(terjadwal)' || '(manual)' }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: "🔄 Sync upstream Google Source"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          [ -n "${GITHUB_TOKEN:-}" ] || { echo "::error::GITHUB_TOKEN tidak tersedia"; exit 1; }

          AUTH="Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$GITHUB_TOKEN"
          echo "::add-mask::${AUTH#Authorization: Basic }"
          TARGET_URL="${TARGET_URL:-https://github.com/${GITHUB_REPOSITORY}.git}"
          gt() { git -c "http.extraheader=$AUTH" "$@"; }

          echo "::group::🔍 Bandingkan commit upstream vs target"
          UP_SHA=$(git ls-remote "$UPSTREAM_URL" "refs/heads/$TARGET_BRANCH" | cut -f1)
          [ -n "$UP_SHA" ] || { echo "::error::Branch $TARGET_BRANCH tidak ditemukan di upstream"; exit 1; }
          TG_SHA=$(gt ls-remote "$TARGET_URL" "refs/heads/$TARGET_BRANCH" | cut -f1)
          echo "upstream: $UP_SHA"
          echo "target  : ${TG_SHA:-<belum ada>}"
          echo "::endgroup::"

          if [ "$UP_SHA" = "$TG_SHA" ]; then
            echo "✅ Sudah sinkron, tidak ada yang di-push."
            echo "✅ Sudah sinkron di \`${UP_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::group::📥 Clone upstream (depth=1, satu branch)"
          for i in 1 2 3; do
            rm -rf work_dir
            git clone --depth=1 --single-branch --no-tags --branch "$TARGET_BRANCH" "$UPSTREAM_URL" work_dir && break
            [ "$i" -lt 3 ] || { echo "::error::Clone upstream gagal 3x"; exit 1; }
            echo "⚠️ Clone gagal ($i/3), mencoba ulang..."; sleep $((i * 10))
          done
          echo "::endgroup::"

          echo "::group::🚀 Push ke repository sendiri"
          cd work_dir
          git remote add target "$TARGET_URL"
          gt push target "HEAD:refs/heads/$TARGET_BRANCH" --no-tags \
            --force-with-lease="refs/heads/$TARGET_BRANCH:${TG_SHA}"
          echo "::endgroup::"

          echo "🔄 Mirror \`${TG_SHA:0:12}${TG_SHA:+}\` → \`${UP_SHA:0:12}\`" | sed 's/`` →/(baru) →/' >> "$GITHUB_STEP_SUMMARY"
          
