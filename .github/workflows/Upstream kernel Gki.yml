name: 📦 Import Kernel AOSP

on:
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: "Branch/tag di android.googlesource.com/kernel/common"
        required: true
        default: "android13-5.15-lts"
      new_branch:
        description: "Nama branch baru di repo ini"
        required: true
        default: "android13-5.15-lts"
      depth:
        description: "Kedalaman history (1 = commit terakhir saja)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  import-kernel:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      AOSP_URL: "https://android.googlesource.com/kernel/common"
      AOSP_REF: ${{ inputs.aosp_ref }}
      NEW_BRANCH: ${{ inputs.new_branch }}
      DEPTH: ${{ inputs.depth }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Clone kernel dari AOSP
        run: |
          set -euo pipefail

          git check-ref-format "refs/heads/$NEW_BRANCH" \
            || { echo "❌ Nama branch tidak valid: $NEW_BRANCH"; exit 1; }
          [[ "$DEPTH" =~ ^[1-9][0-9]*$ ]] \
            || { echo "❌ Depth harus angka >= 1"; exit 1; }

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" "refs/heads/$NEW_BRANCH" >/dev/null 2>&1; then
            echo "❌ Branch $NEW_BRANCH sudah ada di repo ini. Hapus dulu atau pakai nama lain."
            exit 1
          fi

          ok=0
          for i in 1 2 3; do
            echo "📥 Clone $AOSP_REF (percobaan $i/3)"
            if git clone --depth="$DEPTH" --single-branch --branch "$AOSP_REF" "$AOSP_URL" kernel; then
              ok=1; break
            fi
            rm -rf kernel; sleep 15
          done
          [ "$ok" = 1 ] || { echo "❌ Clone gagal setelah 3x percobaan"; exit 1; }

      - name: 🌿 Push ke branch baru
        run: |
          set -euo pipefail
          cd kernel

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          git remote add mine "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          SRC_SHA="$(git rev-parse --short HEAD)"
          KVER="$(make -s kernelversion 2>/dev/null || echo '?')"

          if ! git push mine "HEAD:refs/heads/$NEW_BRANCH"; then
            echo "⚠️ Push ditolak (kemungkinan history shallow), mencoba sebagai commit tunggal"
            git checkout -q --orphan flat
            git commit -q -m "Import kernel/common $AOSP_REF @ $SRC_SHA" \
                           -m "Source: $AOSP_URL"
            git push mine "HEAD:refs/heads/$NEW_BRANCH"
          fi

          {
            echo "### 📦 Import Kernel AOSP"
            echo "- Sumber: \`$AOSP_URL\` (\`$AOSP_REF\`)"
            echo "- Versi kernel: \`$KVER\`"
            echo "- Branch: \`$NEW_BRANCH\`"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
